// ---------- 영상 창의 태그 칸 ----------
// 위: 이 영상의 알약들 (+ = 하나 추가(다른 영상 태그를 많은 순으로 추천), 수정 = 전체를 메모 칸에 펼쳐 고치기)
// 아래: 늘 열려 있는 메모 칸. 쉼표(띄어쓰기도 쉼표로 바뀜)로 적고 Enter·[작성 완료] → 알약으로 위에 붙고 칸은 비워짐.
// 수정 ON: 알약의 ☆ 를 정확히 누르면 즐겨찾기(★), 연필 = 이름 바꾸기. 맨 아래 지금까지 만든 태그 전부(이 영상에 없는 것, 많은 순) — 누르면 이 영상에 붙음.
function tagBox(f) {
  const box = el('div', { className: 'tag-box' });
  const editing = () => document.body.classList.contains('editing');
  let editAll = false; // [수정]으로 전체 태그를 메모 칸에 펼친 상태면 [작성 완료] 가 통째로 바꿈
  const ta = el('textarea', { placeholder: '태그를 쉼표로 구분해 적고 Enter (예: 4k, 게임, 이미지)' });
  const done = el('button', { className: 'primary done', textContent: '작성 완료' });
  const memo = el('div', { className: 'memo' }, ta, done);
  done.onclick = () => {
    const typed = parseTags(ta.value);
    if (editAll) setTags(f, typed);
    else if (typed.length) setTags(f, [...tagsOf(f), ...typed]);
    editAll = false;
    ta.value = '';
    render();
    ta.focus();
  };
  ta.addEventListener('keydown', e => {
    if (e.key === 'Escape' && editAll) { e.preventDefault(); e.stopPropagation(); editAll = false; ta.value = ''; }
  });
  memoKeys(ta, () => done.click());

  // 수정 ON: "모든 태그" 줄. 누르면 이 영상에 바로 붙음 (전체 고치는 중이면 메모 칸 끝에 이어 적음)
  const allTags = () => {
    if (!editing()) return null;
    const counts = tagCounts(), have = editAll ? parseTags(ta.value) : tagsOf(f);
    const list = [...counts.keys()].filter(t => !have.includes(t));
    if (!list.length) return null;
    const pick = t => {
      if (editAll) ta.value = [...parseTags(ta.value), t].join(', ');
      else setTags(f, [...tagsOf(f), t]);
      render();
    };
    return el('div', { className: 'm-sec all-tags' }, el('b', { textContent: '모든 태그' }),
      el('div', { className: 'pills' }, ...list.map(t => pill(t, counts.get(t), { onclick: () => pick(t),
        onStar: () => { toggleFav(t); render(); } }))));
  };

  const render = () => {
    const counts = tagCounts();
    const row = tagsOf(f).length ? el('div', { className: 'pills' },
      ...sortedTags(f, counts).map(t => pill(t, counts.get(t), { onStar: editing() ? () => { toggleFav(t); render(); } : null,
        onRename: editing() ? render : null,
        onDelete: editing() ? () => { setTags(f, tagsOf(f).filter(x => x !== t)); render(); } : null })),
      el('button', { className: 'pill ghost', textContent: '+', title: '태그 하나 추가', onclick: adder }),
      el('button', { className: 'pill ghost', textContent: '수정', title: '태그 전체를 메모 칸에서 고치기',
        onclick: () => { editAll = true; ta.value = tagsOf(f).join(', '); render(); ta.focus(); } })) : null;
    box.replaceChildren(...[row, memo, allTags()].filter(Boolean));
  };
  const adder = () => {
    const counts = tagCounts();
    const input = el('input', { className: 'm-in', placeholder: '추가할 태그', enterKeyHint: 'done' });
    const sugg = el('div', { className: 'pills' });
    const add = t => { t = t.trim(); if (t) setTags(f, [...tagsOf(f), t]); render(); };
    const draw = () => { // 이 영상엔 없는, 다른 영상의 태그를 많은 순으로
      const q = input.value.trim().toLowerCase();
      sugg.replaceChildren(...[...counts.keys()].filter(t => !tagsOf(f).includes(t) && (!q || t.toLowerCase().includes(q)))
        .slice(0, 20).map(t => pill(t, counts.get(t), { onclick: () => add(t) })));
    };
    input.oninput = draw;
    input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(input.value); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); render(); } };
    box.replaceChildren(el('div', { className: 'tag-add' },
      el('div', { className: 'row' }, el('div', { style: 'flex:1' }, input),
        el('button', { className: 'primary', textContent: '추가', onclick: () => add(input.value) }),
        el('button', { textContent: '취소', onclick: render })),
      sugg));
    draw();
    input.focus();
  };
  render();
  return box;
}

// ---------- 제목의 [ ] → 태그 (☰ 메뉴, 수정 ON) ----------
// "[겨울왕국][4k] 누구냐 얘.mp4" → 태그 (겨울왕국)(4k) + 이름 "누구냐 얘.mp4". [ ] 안의 쉼표도 태그로 나눔.
// 이름에서 [ ] 를 빼면 아무것도 안 남는 파일은 이름은 그대로 두고 태그만 붙임.
function splitBrackets(name) {
  const tags = [];
  const rest = name.replace(/\[([^\[\]]*)\]/g, (_, t) => { tags.push(...parseTags(t)); return ' '; });
  const dot = rest.lastIndexOf('.');
  const base = (dot > 0 ? rest.slice(0, dot) : rest).replace(/\s+/g, ' ').trim();
  const ext = dot > 0 ? rest.slice(dot).trim() : '';
  return { tags, name: base ? base + ext : name };
}

function bracketTool() {
  const todo = items.filter(f => /\[[^\[\]]*\]/.test(f.name));
  if (!todo.length) return null;
  const btn = el('button', { textContent: `제목의 [ ] ${todo.length}개를 태그로 옮기기` });
  const sample = splitBrackets(todo[0].name);
  const hint = el('p', { className: 'hint', style: 'margin:0',
    textContent: `예: "${todo[0].name}" → 태그 ${sample.tags.map(t => `(${t})`).join(' ')} + 이름 "${sample.name}". 드라이브 파일 이름이 바뀌어요.` });
  let armed = false;
  btn.onclick = async () => {
    if (!armed) { armed = true; btn.textContent = `✅ ${todo.length}개 바꾸기 (한 번 더 누르면 시작)`; btn.className = 'primary'; return; }
    menu.close();
    convertBrackets(todo);
  };
  return el('div', { className: 'm-sec' }, el('b', { textContent: '제목 정리' }), btn, hint);
}

async function convertBrackets(list) {
  // 태그는 한 번에 붙여 저장, 이름은 하나씩 바꿈(진행 상황 표시). 이름 바꾸기에 실패한 건 원래 이름 그대로
  for (const f of list) {
    const { tags } = splitBrackets(f.name);
    const merged = [...new Set([...tagsOf(f), ...tags])];
    if (merged.length) { gallery.tags[f.id] = merged; pendingSaves.set('t:' + f.id, merged); }
  }
  flushSaves();
  const draft = list.map(file => ({ file, name: splitBrackets(file.name).name }))
    .filter(plan => plan.name !== plan.file.name);
  const result = await TitleEditor.submitRenames(draft);
  if (viewer.open && viewerFile && !$('#vTitle input')) $('#vTitle').textContent = viewerFile.name;
  setStatus(result && (result.failed || result.state === 'failed')
    ? '제목 정리 실패. 제목 작업 상태를 확인해 주세요(태그는 붙음).'
    : '제목 정리 완료.', !!(result && result.failed));
}

// 브라우저는 화면 공유 권한을 저장하지 않으므로, 한 번 허용받은 공유를 페이지를 닫을 때까지 유지해
// 다른 영상이나 다시 찍을 때 또 묻지 않는다 (사용자가 "공유 중지"를 누르면 다음에 다시 물음)
const CAPTURE_LABEL = '지금 화면으로 지정';
let shareSession = null; // { stream, track, video, croppedTo }

// 공유 화면에서 플레이어 영역 [sx, sy, sw, sh]
function playerRect(iframe, cropped, video) {
  if (cropped) return [0, 0, video.videoWidth, video.videoHeight];
  const r = iframe.getBoundingClientRect(), k = video.videoWidth / window.innerWidth;
  return [r.left * k, r.top * k, r.width * k, r.height * k];
}

// 이 탭 화면 공유를 시작한다 (크롬 허용 창). 실패하면 이유 문자열, 성공하면 null
async function startShare() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: 'browser' }, audio: false,
      preferCurrentTab: true, selfBrowserSurface: 'include', surfaceSwitching: 'exclude' });
  } catch { return '허용하지 않았어요.'; } // 공유 창에서 취소
  const [track] = stream.getVideoTracks();
  if (track.getSettings().displaySurface !== 'browser') {
    stream.getTracks().forEach(t => t.stop());
    return '공유 창에서 "이 탭"을 골라 주세요.';
  }
  const video = el('video', { muted: true, playsInline: true });
  video.srcObject = stream;
  await video.play();
  shareSession = { stream, track, video };
  // 브라우저의 "공유 중지"를 누르면 다음엔 다시 묻기
  track.addEventListener('ended', () => {
    if (shareSession && shareSession.stream === stream) { shareSession = null; renderEditBtn(); }
  });
  renderEditBtn();
  return null;
}

// 확장으로 탭 화면을 찍어(찍는 순간 플레이어 컨트롤 숨김) 플레이어(iframe) 영역만 잘라 캔버스로
async function extShot(iframe) {
  const { dataUrl } = await extCall('capture');
  const img = await createImageBitmap(await (await fetch(dataUrl)).blob());
  const r = iframe.getBoundingClientRect(), k = img.width / window.innerWidth;
  const c = el('canvas', { width: Math.round(r.width * k), height: Math.round(r.height * k) });
  c.getContext('2d').drawImage(img, r.left * k, r.top * k, r.width * k, r.height * k, 0, 0, c.width, c.height);
  img.close();
  return c;
}

// ---------- 영상 파일 색인(moov) 캐시 — 대표 장면·시간 조절바 미리보기가 같이 씀 ----------
const mp4s = new Map(); // 영상 ID → Promise<src | null(못 푸는 형식)>
const mp4Reasons = new Map(); // 영상 ID → 직접 뽑을 수 없는 이유 (화면에 표시)
const CODEC_NAMES = { hvc1: 'HEVC/H.265', hev1: 'HEVC/H.265', avc1: 'H.264', avc3: 'H.264', av01: 'AV1', vp09: 'VP9' };
function getMp4(f) {
  if (!mp4s.has(f.id)) {
    const size = +f.size || 0;
    const fail = reason => { mp4Reasons.set(f.id, reason); return null; };
    let p;
    if (!('VideoDecoder' in window)) p = Promise.resolve(fail('이 브라우저는 영상을 직접 풀지 못해요(WebCodecs 없음). PC 크롬·엣지에서 써 주세요.'));
    else if (!size || !/mp4|quicktime|m4v|3gpp/.test(f.mimeType)) p = Promise.resolve(fail(`자동으로 못 뽑는 형식이에요(${f.mimeType}).`));
    else p = openMp4(f.id, size, new AbortController().signal)
      .then(s => {
        if (!s) return fail('파일에 영상 트랙이 없어요.');
        if (s.unsupported) {
          const tag = String(s.codec || '').split('.')[0];
          return fail(`이 브라우저가 이 영상 코덱(${CODEC_NAMES[tag] || s.codec})을 못 풀어요.`);
        }
        return s;
      })
      .catch(e => { mp4s.delete(f.id); if (e instanceof AuthError) throw e; return fail('파일을 읽다 실패했어요: ' + e.message); });
    mp4s.set(f.id, p);
    if (mp4s.size > 8) mp4s.delete(mp4s.keys().next().value);
  }
  return mp4s.get(f.id);
}

// ---------- 대표 장면 5개 (영상 길이의 25·33·50·66·75%) ----------
// 드라이브 영상 파일에서 직접 뽑는다(그 지점 근처만 받음). 보고 있는 플레이어는 건드리지 않음.
// 수정 ON 이면 지금 폴더 순서에서 아직 썸네일을 안 정한 앞쪽 영상 10개를 미리 뽑아 두고,
// 영상 창을 열면 뽑아 둔 것(또는 뽑히는 대로)을 보여준다. 누르면 그 장면으로 바로 적용(창 닫힘, 저장은 뒤에서).
const CAND_POINTS = [0.25, 1 / 3, 0.5, 2 / 3, 0.75];
const candJobs = new Map(); // 영상 ID → { f, status, dur, shots[], subs, ac }
let candRunning = false;

function candJob(f) {
  let j = candJobs.get(f.id);
  if (!j) {
    j = { f, status: 'queued', dur: 0, shots: [], subs: new Set(), ac: new AbortController() };
    candJobs.set(f.id, j);
  }
  return j;
}

function notifyCand(j) { for (const fn of [...j.subs]) fn(); }

// 한 번에 한 영상씩. 지금 열려 있는 영상이 기다리고 있으면 그것부터.
async function runCandJobs() {
  if (candRunning) return;
  candRunning = true;
  try {
    for (;;) {
      const opened = viewer.open && viewerFile && candJobs.get(viewerFile.id);
      const j = opened && opened.status === 'queued' ? opened : [...candJobs.values()].find(x => x.status === 'queued');
      if (!j) break;
      j.status = 'running';
      notifyCand(j);
      try {
        let ok = await extractCandidates(j);
        // 파일에서 직접 못 뽑는 영상(예: 이 PC가 못 푸는 HEVC)은 화면 밖에 숨긴 플레이어로 (확장 필요)
        if (!ok && extReady && !j.ac.signal.aborted) { j.shots = []; ok = await extractViaHiddenPlayer(j); }
        j.status = ok ? 'done' : 'unsupported';
      } catch (e) {
        if (e instanceof AuthError) { j.status = 'queued'; notifyCand(j); break; } // 다시 로그인하면 이어서
        j.status = j.ac.signal.aborted ? 'aborted' : 'unsupported';
        if (!j.reason) j.reason = '오류가 났어요: ' + (e.message || e);
      }
      notifyCand(j);
    }
  } finally {
    candRunning = false;
  }
}

// 이 브라우저가 풀 수 없는 형식이면 false
async function extractCandidates(j) {
  const { f } = j, signal = j.ac.signal;
  const src = await getMp4(f);
  if (!src) { j.reason = mp4Reasons.get(f.id); return false; }
  j.dur = src.duration;
  notifyCand(j);
  let made = 0;
  for (const [i, p] of CAND_POINTS.entries()) {
    if (signal.aborted) throw new DOMException('중단', 'AbortError');
    // 영상 창의 플레이어가 불러오는 중이면 기다림 (최대 12초)
    for (let w = 0; playerLoading && w < 60; w++) await new Promise(r => setTimeout(r, 200));
    try {
      const { frame, t } = await extractFrame(src, p * src.duration, signal, true);
      const c = el('canvas');
      drawFrame(c, frame, src.rotation);
      frame.close();
      j.shots[i] = { t, thumb: capture(c, c.width, c.height) };
      made++;
    } catch (e) {
      if (signal.aborted || e instanceof AuthError) throw e;
      j.shots[i] = 'fail';
      j.reason = '장면을 풀다 실패했어요: ' + (e.message || e);
    }
    notifyCand(j);
  }
  return made > 0;
}

// 숨은 플레이어로 뽑기: 화면 밖(보이지 않는 곳)에 드라이브 플레이어를 하나 더 띄워
// 음소거로 불러온 뒤 각 지점으로 옮겨 장면을 복사하고, 끝나면 치움. 보고 있는 플레이어는 건드리지 않는다.
async function extractViaHiddenPlayer(j) {
  const { f } = j, signal = j.ac.signal;
  const stop = () => { if (signal.aborted) throw new DOMException('중단', 'AbortError'); };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  j.dur = 0; // 화면의 대표 장면 칸을 "뽑는 중…"으로 되돌림
  notifyCand(j);
  const fr = el('iframe', { src: `https://drive.google.com/file/d/${f.id}/preview?dgbg=1`, allow: 'autoplay', tabIndex: -1 });
  fr.setAttribute('aria-hidden', 'true');
  Object.assign(fr.style, { position: 'fixed', left: '-10000px', top: '0', width: '640px', height: '360px', border: '0' });
  document.body.append(fr);
  try {
    await new Promise(r => { fr.onload = r; setTimeout(r, 15000); });
    let dur = 0;
    for (const t0 = Date.now(); !dur && Date.now() - t0 < 20000;) {
      stop();
      await extCall('bg', { action: 'kick' }).catch(() => {});
      await sleep(700);
      const st = await extCall('bg', { action: 'state' }).catch(() => null);
      if (st && st.duration) dur = st.duration;
    }
    if (!dur) { j.reason = (j.reason ? j.reason + ' ' : '') + '(숨은 플레이어도 불러오지 못했어요)'; return false; }
    j.dur = dur;
    notifyCand(j);
    let made = 0;
    for (const [i, p] of CAND_POINTS.entries()) {
      stop();
      for (let w = 0; playerLoading && w < 60; w++) await sleep(200); // 보고 있는 플레이어가 먼저
      const r = await extCall('bg', { action: 'grab', delta: p * dur }, 15000).catch(() => null);
      if (r && r.dataUrl) { j.shots[i] = { t: r.t, thumb: r.dataUrl }; made++; } else j.shots[i] = 'fail';
      notifyCand(j);
    }
    return made > 0;
  } finally {
    fr.remove();
  }
}

// 수정 ON 일 때: 지금 폴더의 정렬 순서에서 아직 썸네일을 안 정한 앞쪽 영상 10개(+지금 연 영상)만 남기고 미리 뽑기
// (한 번에 한 영상씩 순서대로, 지금 연 영상이 기다리고 있으면 그것부터)
const PREFETCH_COUNT = 10;
function prefetchCandidates() {
  if (!document.body.classList.contains('editing') || !token) return;
  const todo = items.filter(x => !gallery.videos[x.id] && !isHidden(x)).slice(0, PREFETCH_COUNT);
  const keep = new Set(todo.map(x => x.id));
  if (viewer.open && viewerFile) keep.add(viewerFile.id);
  for (const [id, j] of candJobs) {
    if (keep.has(id)) continue;
    j.ac.abort(); // 이미 정했거나 순서에서 밀린 영상은 멈추고 버림
    candJobs.delete(id);
  }
  for (const x of todo) candJob(x);
  runCandJobs();
}

function candSlots(box, dur) {
  box.replaceChildren();
  return CAND_POINTS.map(p => {
    const b = el('button', { className: 'cand', disabled: true }, el('div', { className: 'cand-img' }),
      el('span', { textContent: `${Math.round(p * 100)}% · ${fmtTime(p * dur)}` }));
    box.append(b);
    return b;
  });
}

function fillSlot(f, b, thumb, t) {
  b.firstChild.replaceWith(el('img', { src: thumb, alt: '' }));
  b.disabled = false;
  b.onclick = () => {
    saveEntry(f.id, { t: Math.round(t * 10) / 10, thumb, at: new Date().toISOString() });
    viewer.close();
  };
}

// 영상 창의 대표 장면 칸: 그 영상의 작업 결과를 보여주고, 새 장면이 뽑힐 때마다 채움
function showCandidates(f, iframe, box, captureBtn) {
  const j = candJob(f);
  let slots = null, filled = [];
  const render = () => {
    if (!box.isConnected) return j.subs.delete(render); // 창을 닫았거나 다른 화면으로 바뀜
    if (j.status === 'aborted') {
      // 미리 뽑기 정리 중에 취소된 작업 → 실패가 아니므로 버튼 대신 새로 다시 뽑음
      j.subs.delete(render);
      if (candJobs.get(f.id) === j) candJobs.delete(f.id);
      box.replaceChildren();
      return showCandidates(f, iframe, box, captureBtn);
    }
    if (j.status === 'unsupported') {
      j.subs.delete(render);
      return box.replaceChildren(
        el('button', { className: 'ext-only', textContent: '플레이어로 대표 장면 뽑기 (플레이어가 3~4초 움직여요)',
          onclick: () => candidatesFromPlayer(f, iframe, box, captureBtn) }),
        el('p', { className: 'hint', textContent: '대표 장면을 자동으로 못 뽑았어요 — ' + (j.reason || '이유를 알 수 없어요.') }));
    }
    if (!j.dur) {
      slots = null;
      return box.replaceChildren(el('p', { className: 'hint', textContent: j.status === 'queued' ? '대표 장면: 앞 영상 다음 차례예요…' : '대표 장면 뽑는 중…' }));
    }
    // 처음이거나, 숨은 플레이어로 다시 뽑기 시작해서 길이가 바뀌면 칸을 새로 만듦
    if (!slots || slots.dur !== j.dur) { slots = candSlots(box, j.dur); slots.dur = j.dur; filled = []; }
    j.shots.forEach((s, i) => {
      if (!s || filled[i] === s) return;
      filled[i] = s;
      if (s === 'fail') slots[i].lastChild.textContent += ' · 실패';
      else fillSlot(f, slots[i], s.thumb, s.t);
    });
  };
  j.subs.add(render);
  render();
  runCandJobs();
}

// 파일에서 못 뽑는 형식일 때(확장 필요, 누를 때만): 플레이어를 각 지점으로 옮겨 찍고 원래 위치로 돌아감
async function candidatesFromPlayer(f, iframe, box, captureBtn) {
  let start = null;
  try { start = await extCall('player', { action: 'state' }); } catch {}
  if (!start || !start.duration) return showPreviewMessage('영상을 한 번 클릭해 불러온 뒤 눌러 주세요.');
  const dur = start.duration, back = start.time, mine = viewerFile;
  const alive = () => viewer.open && viewerFile === mine;
  const slots = candSlots(box, dur);
  captureBtn.disabled = true; // 찍는 동안 📸 와 겹치지 않게
  let last = 0;
  try {
    for (const [i, p] of CAND_POINTS.entries()) {
      if (!alive()) return;
      await extCall('player', { action: 'seekToWait', delta: p * dur });
      const wait = 550 - (performance.now() - last); // 크롬 탭 캡처는 초당 2번까지
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
      if (!alive()) return;
      const shot = await extShot(iframe);
      last = performance.now();
      const r = contentRect(shot); // 플레이어의 검은 여백 제외
      const c = el('canvas', { width: r.w, height: r.h });
      c.getContext('2d').drawImage(shot, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
      fillSlot(f, slots[i], capture(c, r.w, r.h), p * dur);
    }
  } catch (e) {
    if (alive()) showPreviewMessage('대표 장면을 뽑지 못했어요: ' + e.message);
  } finally {
    if (alive()) {
      captureBtn.disabled = false;
      extCall('player', { action: 'seekTo', delta: back }).catch(() => {});
    }
  }
}

// 확장 프로그램으로 캡처: 공유 허용 없이, 찍는 순간 플레이어 컨트롤을 숨기고 탭 화면을 찍어 플레이어 영역만 잘라냄
async function captureViaExt(f, iframe, btn) {
  btn.disabled = true;
  $('#preview').replaceChildren();
  try {
    askThumb(f, await extShot(iframe), btn);
  } catch (e) {
    showPreviewMessage('캡처하지 못했어요: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

// 📸 누름 → 바로 이 탭 화면을 한 프레임 캡처해 플레이어(iframe) 영역만 잘라낸다.
async function captureFrame(f, iframe, btn) {
  if (btn.disabled) return;
  if (extReady) return captureViaExt(f, iframe, btn);
  if (!shareSession) {
    const why = await startShare();
    if (why) return showPreviewMessage(why);
  }
  // 지금 열린 영상의 플레이어 영역만 잘라 받기. 영상마다 iframe 이 새로 생기므로 바뀌었을 때만 다시 지정
  let cropped = false;
  if (window.CropTarget && shareSession.track.cropTo) {
    if (shareSession.croppedTo !== iframe) {
      try { await shareSession.track.cropTo(await CropTarget.fromElement(iframe)); } catch {
        // 자르기는 이 탭을 공유할 때만 됨 → 다른 탭을 고른 것
        shareSession.stream.getTracks().forEach(t => t.stop());
        shareSession = null;
        renderEditBtn();
        return showPreviewMessage('다른 탭이 공유됐어요. "지금 화면으로 지정"을 다시 누르고 공유 창에서 "이 탭"을 골라 주세요.');
      }
      shareSession.croppedTo = iframe;
      // 잘린 첫 프레임이 들어올 때까지만 (최대 0.3초)
      const v = shareSession.video;
      await new Promise(r => { if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => r()); setTimeout(r, 300); });
    }
    cropped = true;
  }
  $('#preview').replaceChildren();
  btn.disabled = true;
  try {
    const { video } = shareSession;
    const [sx, sy, sw, sh] = playerRect(iframe, cropped, video);
    const c = el('canvas', { width: Math.round(sw), height: Math.round(sh) });
    c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
    askThumb(f, c, btn);
  } catch (e) {
    showPreviewMessage('캡처하지 못했어요: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function previewImage(f, blob, btn) {
  try {
    const bmp = await createImageBitmap(blob);
    const w = Math.min(1280, bmp.width), h = Math.round(bmp.height * w / bmp.width);
    const c = el('canvas', { width: w, height: h });
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    bmp.close();
    askThumb(f, c, btn);
  } catch { showPreviewMessage('이미지를 열지 못했어요.'); }
}

function showPreviewMessage(text) {
  // 영상 창이 닫혀 있으면(☰ 메뉴의 제목 정리 등) 위쪽 상태 줄에
  if ($('#preview')) $('#preview').replaceChildren(el('p', { className: 'hint', textContent: text }));
  else setStatus(text, true);
}

// 영상 둘레의 검은 여백(세로 영상 양옆 등)을 뺀 실제 영상 영역 {x, y, w, h}. 못 찾으면 전체.
function contentRect(canvas) {
  const { width: W, height: H } = canvas;
  const d = canvas.getContext('2d').getImageData(0, 0, W, H).data;
  const bright = (x, y) => { const i = (y * W + x) * 4; return d[i] + d[i + 1] + d[i + 2] > 60; };
  // 한 줄(행/열)에서 밝은 점이 2% 넘게 있으면 영상이 있는 줄
  const rowHas = y => { let n = 0, c = 0; for (let x = 0; x < W; x += 4) { c++; if (bright(x, y)) n++; } return n > c * 0.02; };
  const colHas = x => { let n = 0, c = 0; for (let y = 0; y < H; y += 4) { c++; if (bright(x, y)) n++; } return n > c * 0.02; };
  // 캡처 가장자리 1~2px 은 잘라낸 경계에 섞인 색이 남을 수 있어 건너뛰고 찾는다 (영상이 끝까지 차 있으면 다시 0까지)
  const E = 2;
  let top = E, bottom = H - 1 - E, left = E, right = W - 1 - E;
  while (top < bottom && !rowHas(top)) top++;
  while (bottom > top && !rowHas(bottom)) bottom--;
  while (left < right && !colHas(left)) left++;
  while (right > left && !colHas(right)) right--;
  if (top === E) top = 0;
  if (left === E) left = 0;
  if (bottom === H - 1 - E) bottom = H - 1;
  if (right === W - 1 - E) right = W - 1;
  const r = { x: left, y: top, w: right - left + 1, h: bottom - top + 1 };
  return r.w * r.h < W * H * 0.15 ? { x: 0, y: 0, w: W, h: H } : r; // 거의 다 검으면 전체
}

// 플레이어 자리에 찍힌 화면을 겹쳐 띄우고, 그 위에 끌어서 조절하는 영역 상자를 둔다.
// 반환: { rect() 지금 상자(캔버스 픽셀 기준), remove() }
function openCropper(canvas) {
  const W = canvas.width, H = canvas.height;
  const box = el('div', { className: 'crop-box' });
  const dirs = { nw: [0, 0], n: [50, 0], ne: [100, 0], e: [100, 50], se: [100, 100], s: [50, 100], sw: [0, 100], w: [0, 50] };
  for (const [dir, [x, y]] of Object.entries(dirs)) {
    const h = el('i');
    h.dataset.dir = dir;
    Object.assign(h.style, { left: x + '%', top: y + '%', cursor: dir + '-resize' });
    box.append(h);
  }
  const ov = el('div', { className: 'cropper' }, canvas, box);
  viewerUI.playerWrap.append(ov);
  let r = contentRect(canvas), scale = 1, ox = 0, oy = 0;
  const render = () => {
    scale = Math.min(ov.clientWidth / W, ov.clientHeight / H);
    ox = (ov.clientWidth - W * scale) / 2;
    oy = (ov.clientHeight - H * scale) / 2;
    Object.assign(canvas.style, { left: ox + 'px', top: oy + 'px', width: W * scale + 'px', height: H * scale + 'px' });
    Object.assign(box.style, { left: ox + r.x * scale + 'px', top: oy + r.y * scale + 'px', width: r.w * scale + 'px', height: r.h * scale + 'px' });
  };
  const ro = new ResizeObserver(render);
  ro.observe(ov);
  render();
  box.addEventListener('pointerdown', e => {
    e.preventDefault();
    box.setPointerCapture(e.pointerId);
    const dir = e.target.dataset.dir || 'move', start = { ...r }, sx = e.clientX, sy = e.clientY, min = 16;
    const onMove = ev => {
      const dx = (ev.clientX - sx) / scale, dy = (ev.clientY - sy) / scale;
      let { x, y, w, h } = start;
      if (dir === 'move') {
        x = Math.min(Math.max(0, x + dx), W - w);
        y = Math.min(Math.max(0, y + dy), H - h);
      } else {
        if (dir.includes('w')) { const nx = Math.min(Math.max(0, x + dx), x + w - min); w += x - nx; x = nx; }
        if (dir.includes('e')) w = Math.min(Math.max(min, w + dx), W - x);
        if (dir.includes('n')) { const ny = Math.min(Math.max(0, y + dy), y + h - min); h += y - ny; y = ny; }
        if (dir.includes('s')) h = Math.min(Math.max(min, h + dy), H - y);
      }
      r = { x, y, w, h };
      render();
    };
    const onUp = () => { box.removeEventListener('pointermove', onMove); box.removeEventListener('pointerup', onUp); };
    box.addEventListener('pointermove', onMove);
    box.addEventListener('pointerup', onUp);
  });
  return {
    rect: () => ({ x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.w), h: Math.round(r.h) }),
    remove: () => { ro.disconnect(); ov.remove(); },
  };
}

// 누른 버튼(📸 / 🖼️)이 그 자리에서 [바꾸기]로 바뀌고 옆에 [취소]가 생긴다 (마우스를 옮길 필요 없음)
// 그동안 플레이어 자리에 영역 조절기가 뜨고, [바꾸기]를 누르면 그 영역만 썸네일로 저장
let restorePending = null; // [바꾸기] 대기 중이면 원래 버튼으로 되돌리는 함수
function askThumb(f, canvas, btn) {
  if (window.mergePick && window.mergePick.f === f) { // 합치기용 앞 1초 장면: 자르기 없이 그대로 넘기고 창 닫기
    const pick = window.mergePick;
    viewer.close();
    return pick.done(canvas);
  }
  if (restorePending) restorePending();
  const { textContent: label, className, onclick } = btn;
  const cancel = el('button', { textContent: '취소' });
  const cropper = openCropper(canvas);
  restorePending = () => {
    Object.assign(btn, { textContent: label, className, onclick, disabled: false });
    btn.style.minWidth = '';
    cancel.remove();
    cropper.remove();
    restorePending = null;
  };
  cancel.onclick = restorePending;
  btn.style.minWidth = btn.offsetWidth + 'px'; // 폭을 그대로 둬서 누른 자리에 [바꾸기]가 오게
  Object.assign(btn, { textContent: '바꾸기', disabled: false });
  btn.classList.add('primary');
  btn.onclick = () => {
    const r = cropper.rect();
    const out = el('canvas', { width: r.w, height: r.h });
    out.getContext('2d').drawImage(canvas, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
    saveEntry(f.id, { t: null, thumb: capture(out, r.w, r.h), at: new Date().toISOString() });
    viewer.close(); // 저장은 뒤에서 — 바로 다음 영상으로
  };
  btn.after(cancel);
}

// 스크린샷 붙여넣기(Ctrl+V)
document.addEventListener('paste', e => {
  if (!viewer.open || !viewerFile || !$('#preview') || !document.body.classList.contains('editing')) return;
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  const { captureBtn } = viewerUI;
  if (captureBtn.isConnected) previewImage(viewerFile, item.getAsFile(), captureBtn);
});

function resetThumb(f) {
  saveEntry(f.id, null);
  viewer.close();
}

// ---------- 장면 지정 ----------
// MP4/MOV: 파일 색인(moov)과, 고른 시점이 속한 구간(키프레임~다음 키프레임)만 받아 그 프레임 하나만 디코딩한다.
// 그 외 형식이나 미지원 브라우저: 서비스 워커 스트리밍으로 <video> 탐색.
const MP4BOX_SRC = 'https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js';
const MP4BOX_SRI = 'sha384-9oK16t6TCKqCB5OpB/LwRkNa48prlRFQPTYw8tb9uj699JvQ1wjxIq7YO8Z4hn3a';
let mp4boxLoading = null;
function loadMp4box() {
  return mp4boxLoading = mp4boxLoading || new Promise((resolve, reject) => {
    document.head.append(el('script', { src: MP4BOX_SRC, integrity: MP4BOX_SRI, crossOrigin: 'anonymous', onload: resolve,
      onerror: () => { mp4boxLoading = null; reject(new Error('mp4box 로드 실패')); } }));
  });
}

async function rangeBuf(id, start, end, signal) {
  const res = await api(`${DRIVE}/files/${id}?alt=media`, { headers: { Range: `bytes=${start}-${end}` }, signal });
  if (res.status !== 206) { if (res.body) res.body.cancel(); throw new Error('부분 다운로드를 지원하지 않는 응답'); }
  return res.arrayBuffer();
}

// 최상위 박스 헤더만 훑어 ftyp(파일 형식)와 moov(색인)만 받아 이어 붙인다. mdat(영상 데이터)는 건너뜀.
async function findMoov(id, size, signal) {
  let pos = 0, ftyp = null;
  while (pos + 8 <= size) {
    const head = new DataView(await rangeBuf(id, pos, Math.min(pos + 15, size - 1), signal));
    const type = String.fromCharCode(head.getUint8(4), head.getUint8(5), head.getUint8(6), head.getUint8(7));
    let len = head.getUint32(0);
    if (len === 1) len = Number(head.getBigUint64(8));
    else if (len === 0) len = size - pos;
    if (len < 8) break;
    if (type === 'ftyp') ftyp = await rangeBuf(id, pos, pos + len - 1, signal);
    if (type === 'moov') {
      const moov = await rangeBuf(id, pos, pos + len - 1, signal);
      // 옛 QuickTime(.mov)은 ftyp 가 없을 수 있어 최소 형태로 채움 (mp4box 가 요구)
      if (!ftyp) ftyp = new Uint8Array([0, 0, 0, 20, ...'ftypqt  ', 0, 0, 0, 0, ...'qt  '].map(c => typeof c === 'string' ? c.charCodeAt(0) : c)).buffer;
      const out = new Uint8Array(ftyp.byteLength + moov.byteLength);
      out.set(new Uint8Array(ftyp), 0);
      out.set(new Uint8Array(moov), ftyp.byteLength);
      return out.buffer;
    }
    pos += len;
  }
  throw new Error('영상 색인(moov)을 찾지 못했어요');
}

function decoderDescription(trak) {
  for (const entry of trak.mdia.minf.stbl.stsd.entries) {
    const box = entry.avcC || entry.hvcC || entry.vpcC || entry.av1C;
    if (box) {
      const s = new DataStream(undefined, 0, DataStream.BIG_ENDIAN);
      box.write(s);
      return new Uint8Array(s.buffer, 8); // 박스 헤더 8바이트 제외
    }
  }
}

async function openMp4(id, size, signal) {
  await loadMp4box();
  const moov = await findMoov(id, size, signal);
  const mp4 = MP4Box.createFile();
  let info = null;
  mp4.onReady = i => { info = i; };
  moov.fileStart = 0; // 색인만 따로 파싱 (샘플 위치는 파일 절대 오프셋이라 영향 없음)
  mp4.appendBuffer(moov);
  mp4.flush();
  const track = info && info.videoTracks[0];
  if (!track) return null;
  const trak = mp4.getTrackById(track.id);
  const config = { codec: track.codec, codedWidth: track.video.width, codedHeight: track.video.height, description: decoderDescription(trak) };
  if (!(await VideoDecoder.isConfigSupported(config)).supported) return { unsupported: true, codec: track.codec };
  const m = track.matrix; // 폰 세로 영상 등의 회전 정보
  const rotation = (Math.round(Math.atan2(m[1], m[0]) * 180 / Math.PI) + 360) % 360;
  return { id, config, rotation, samples: trak.samples, timescale: track.timescale,
    duration: info.duration / info.timescale, cache: new Map() };
}

// t초에 보이는 프레임을 디코딩해 { frame(VideoFrame), t(실제 프레임 시각) } 반환
// onlyNeeded: 그 프레임까지만 받음(한 번만 뽑을 때, 대표 장면용). 아니면 구간 전체를 받아 두고 재사용(미세 이동용)
async function extractFrame(src, t, signal, onlyNeeded) {
  const { samples, timescale } = src;
  const want = t * timescale;
  let target = 0;
  for (let i = 0; i < samples.length; i++) {
    if (samples[i].cts <= want && samples[i].cts >= samples[target].cts) target = i;
  }
  let key = target;
  while (key > 0 && !samples[key].is_sync) key--;
  let next = target + 1;
  while (!onlyNeeded && next < samples.length && !samples[next].is_sync) next++;
  // 키프레임~다음 키프레임 직전(한 구간)을 한 번에 받아 두고, 같은 구간 안 미세 이동은 재사용
  let gop = onlyNeeded ? null : src.cache.get(key);
  if (!gop) {
    let lo = Infinity, hi = 0;
    for (let i = key; i < next; i++) { lo = Math.min(lo, samples[i].offset); hi = Math.max(hi, samples[i].offset + samples[i].size); }
    gop = { lo, buf: await rangeBuf(src.id, lo, hi - 1, signal) };
    if (!onlyNeeded) {
      src.cache.set(key, gop);
      if (src.cache.size > 3) src.cache.delete(src.cache.keys().next().value);
    }
  }
  const us = v => Math.round(v * 1e6 / timescale);
  const wantTs = us(samples[target].cts);
  let best = null;
  const decoder = new VideoDecoder({
    output: frame => { if (frame.timestamp === wantTs) { if (best) best.close(); best = frame; } else frame.close(); },
    error: () => {},
  });
  decoder.configure(src.config);
  for (let i = key; i <= target; i++) {
    const s = samples[i];
    decoder.decode(new EncodedVideoChunk({
      type: s.is_sync ? 'key' : 'delta', timestamp: us(s.cts), duration: us(s.duration),
      data: new Uint8Array(gop.buf, s.offset - gop.lo, s.size),
    }));
  }
  await decoder.flush();
  decoder.close();
  if (!best) throw new Error('프레임을 디코딩하지 못했어요');
  return { frame: best, t: samples[target].cts / timescale };
}

function drawFrame(canvas, frame, rotation) {
  const w = frame.displayWidth, h = frame.displayHeight, swap = rotation % 180 !== 0;
  canvas.width = swap ? h : w;
  canvas.height = swap ? w : h;
  const g = canvas.getContext('2d');
  g.translate(canvas.width / 2, canvas.height / 2);
  g.rotate(rotation * Math.PI / 180);
  g.drawImage(frame, -w / 2, -h / 2, w, h);
}

// 꾹 누르면 반복: 누를 때 한 번 → 0.4초 뒤부터 0.12초마다. 앞 요청이 끝나기 전엔 다음을 보내지 않음
function holdRepeat(btn, fn) {
  let timer = null, busy = false;
  const fire = () => {
    if (busy) return;
    busy = true;
    Promise.resolve(fn()).finally(() => { busy = false; });
  };
  const stop = () => { clearTimeout(timer); timer = null; };
  btn.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    stop();
    fire();
    timer = setTimeout(function repeat() { fire(); timer = setTimeout(repeat, 120); }, 400);
  });
  for (const t of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(t, stop);
  btn.addEventListener('click', e => { if (e.detail === 0) fire(); }); // 키보드(Enter/Space)로 누른 경우
  return btn;
}

function fmtTenth(t) { const d = Math.round(t * 10); return fmtTime(Math.floor(d / 10)) + '.' + (d % 10); }
// 영상/캔버스의 현재 화면을 긴 변 최대 640px JPEG(data URL)로 (비율 유지)
function capture(source, sw, sh, maxSide = 640) {
  const k = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.round(sw * k), h = Math.round(sh * k);
  const c = el('canvas', { width: w, height: h });
  c.getContext('2d').drawImage(source, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.8);
}

// ---------- 확장 프로그램 (있으면 공유 허용 없이 캡처 + 플레이어 조작) ----------
let extReady = false, extVersion = '';
const extWaiters = new Map();
window.addEventListener('message', e => {
  if (e.source !== window || !e.data || e.data.source !== 'dgallery-ext') return;
  if (e.data.type === 'ready') {
    extVersion = e.data.version || extVersion;
    if (!extReady) { extReady = true; document.body.classList.add('has-ext'); renderEditBtn(); syncAutoPause(); }
  } else if (e.data.type === 'result') {
    const done = extWaiters.get(e.data.id);
    if (done) { extWaiters.delete(e.data.id); done(e.data); }
  }
});
window.postMessage({ source: 'dgallery-page', type: 'ping' }, location.origin);

function extCall(type, extra = {}, timeoutMs = 5000) {
  return new Promise((resolve, reject) => {
    const id = crypto.randomUUID();
    const timer = setTimeout(() => { extWaiters.delete(id); reject(new Error('확장 프로그램이 응답하지 않아요.')); }, timeoutMs);
    extWaiters.set(id, res => { clearTimeout(timer); if (res.ok) resolve(res); else reject(new Error(res.error || '확장 프로그램 오류')); });
    window.postMessage({ source: 'dgallery-page', type, id, ...extra }, location.origin);
  });
}

// ---------- 시작 ----------
async function start() {
  $('#login').hidden = true;
  $('#authBtn').hidden = false;
  $('#editBtn').hidden = false;
  renderEditBtn();
  renderCatbar();
  setStatus('불러오는 중…');
  try {
    // 목록과 gallery.json 을 동시에 받음 (전에는 gallery.json 을 다 받은 뒤에야 목록을 시작)
    const galleryLoading = loadGallery().then(() => flushSaves()); // 로그인이 만료돼 멈췄던 저장이 있으면 이어서
    galleryLoading.catch(() => {});
    await openFolder(galleryLoading);
  } catch (e) { handleError(e); }
}

setEditMode(sessionStorage.getItem('editMode') === '1');
$('#editBtn').onclick = async () => {
  if (needsShare()) {
    const why = await startShare();
    return renderEditBtn(why ? why + ' 버튼을 다시 누르면 다시 물어요.' : undefined);
  }
  setEditMode(!document.body.classList.contains('editing'));
};
$('#authBtn').textContent = '로그아웃';
$('#authBtn').onclick = () => $('#authBtn').dataset.expired ? relogin() : showLoggedOut('로그아웃했어요.');
$('#loginBtn').onclick = async () => {
  try { await requestToken(); start(); } catch (e) { setStatus('로그인 실패: ' + e.message, true); }
};
$('#clientIdSave').onclick = () => {
  const v = $('#clientIdInput').value.trim();
  if (!v.endsWith('.apps.googleusercontent.com')) return setStatus('클라이언트 ID 형식이 아니에요.', true);
  localStorage.setItem('clientId', v);
  location.reload();
};

(async () => {
  if (!clientId()) { $('#setup').hidden = false; return; }
  try { await loadGis(); } catch { return setStatus('구글 로그인 스크립트를 불러오지 못했어요.', true); }
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: clientId(), scope: SCOPES, callback: () => {} });
  restoreToken();
  if (token) start(); else $('#login').hidden = false;
})();
