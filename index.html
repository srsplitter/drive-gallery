<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>드라이브 영상 갤러리</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --bg: #111317; --panel: #1b1e24; --line: #2a2e36; --text: #e8eaee; --dim: #9aa1ad;
    --accent: #4c8dff; --accent-text: #fff; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 8px 14px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { border-color: var(--dim); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .5; cursor: default; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(17,19,23,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    display: flex; gap: 12px; align-items: center; }
  header h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  #crumbs { flex: 1; min-width: 0; display: flex; gap: 4px; align-items: center; overflow-x: auto; white-space: nowrap; color: var(--dim); }
  #crumbs a { color: var(--dim); cursor: pointer; padding: 2px 4px; border-radius: 6px; }
  #crumbs a:last-child { color: var(--text); font-weight: 600; }
  #crumbs a:hover { background: var(--panel); }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .notice { max-width: 560px; margin: 40px auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px; }
  .notice h2 { margin-top: 0; font-size: 18px; }
  .notice input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; margin: 8px 0 12px; }
  #status { color: var(--dim); text-align: center; padding: 24px 0; }
  #status:empty { display: none; }
  #status.error { color: var(--danger); }
  #grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  @media (max-width: 520px) { #grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } main { padding: 12px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer;
    text-align: left; padding: 0; display: block; width: 100%; }
  .card:hover { border-color: var(--dim); }
  .thumb { aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; position: relative; display: grid; place-items: center; }
  .thumb { overflow: hidden; }
  body:not(.editing) .edit-only, body:not(.has-ext) .ext-only, body.has-ext .no-ext-only { display: none !important; }
  .edit-wrap { position: relative; }
  #saveState { font-size: 13px; color: var(--dim); white-space: nowrap; }
  #saveState.error { color: var(--danger); white-space: normal; max-width: 280px; }
  #editNote { position: absolute; right: 0; top: calc(100% + 8px); width: min(300px, 80vw); display: grid; gap: 8px;
    background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  #editNote[hidden] { display: none; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .player-wrap { position: relative; }
  .seek-bar { flex: 1; accent-color: var(--accent); }
  .row.end { justify-content: flex-end; }
  button.danger { background: #c62828; border-color: #c62828; color: #fff; }
  body.editing #vTitle { cursor: text; }
  body.editing #vTitle:hover { text-decoration: underline dotted; }
  #vTitle input { width: 100%; font: inherit; font-weight: 600; padding: 4px 8px; border-radius: 8px;
    border: 1px solid var(--accent); background: var(--bg); color: var(--text); }
  .cands { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .cands:empty { display: none; }
  .cands > :not(.cand) { grid-column: 1 / -1; justify-self: start; margin: 0; }
  .cand { padding: 0; overflow: hidden; display: grid; text-align: center; }
  .cand img, .cand .cand-img { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; display: block; }
  .cand span { font-size: 12px; padding: 4px; color: var(--dim); }
  .cand:disabled .cand-img { animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: .4; } }
  .cropper { position: absolute; inset: 0; overflow: hidden; background: #000; border-radius: 8px; touch-action: none; }
  .cropper canvas { position: absolute; }
  .crop-box { position: absolute; box-sizing: border-box; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); cursor: move; }
  .crop-box i { position: absolute; width: 14px; height: 14px; margin: -8px 0 0 -8px; background: #fff; border-radius: 3px; }
  .thumb .icon { font-size: 44px; }
  .badge { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.75); color: #fff; font-size: 12px;
    padding: 1px 6px; border-radius: 6px; }
  .badge.pin { left: 6px; right: auto; background: var(--accent); }
  .name { padding: 8px 10px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text);
    padding: 0; width: min(960px, 100vw - 16px); max-height: calc(100dvh - 16px); overflow: auto; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .v-head { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .v-head .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .v-body { padding: 12px; display: grid; gap: 10px; }
  .frame { width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; border-radius: 8px; display: block; }
  video.frame { max-height: 60dvh; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .hint { color: var(--dim); font-size: 13px; }
  .time { font-variant-numeric: tabular-nums; min-width: 72px; text-align: center; }
  canvas.frame { object-fit: contain; max-height: 60dvh; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .time-input { width: 96px; text-align: center; padding: 8px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>🎬 영상 갤러리</h1>
  <nav id="crumbs"></nav>
  <span id="saveState"></span>
  <span class="edit-wrap"><button id="editBtn" hidden></button><div id="editNote" hidden></div></span>
  <button id="authBtn" hidden></button>
</header>
<main>
  <section id="setup" class="notice" hidden>
    <h2>처음 설정</h2>
    <p class="hint">Google Cloud에서 발급받은 OAuth 클라이언트 ID를 붙여넣으세요. 이 브라우저에만 저장됩니다.</p>
    <input id="clientIdInput" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off">
    <button class="primary" id="clientIdSave">저장</button>
  </section>
  <section id="login" class="notice" hidden>
    <h2>구글 로그인</h2>
    <p class="hint">내 드라이브 영상 목록을 읽고, 지정한 썸네일을 내 드라이브의 숨김 앱 폴더에 저장합니다. 영상 자체는 바뀌지 않습니다.</p>
    <button class="primary" id="loginBtn">구글로 로그인</button>
  </section>
  <div id="status"></div>
  <div id="grid"></div>
</main>

<dialog id="viewer">
  <div class="v-head">
    <div class="title" id="vTitle"></div>
    <button id="vClose" aria-label="닫기">✕</button>
  </div>
  <div class="v-body" id="vBody"></div>
</dialog>

<script>
// Google Cloud에서 발급한 OAuth 클라이언트 ID (공개값, 비밀 아님). 비어 있으면 첫 화면에서 입력받는다.
const CLIENT_ID = '';
const SCOPES = 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.appdata';
// 영상 이름 바꾸기·휴지통으로 옮기기에는 드라이브 수정 권한이 필요 — 그 기능을 처음 쓸 때만 추가로 요청
const SCOPE_WRITE = 'https://www.googleapis.com/auth/drive';
const DRIVE = 'https://www.googleapis.com/drive/v3';
const UPLOAD = 'https://www.googleapis.com/upload/drive/v3';
const GALLERY_NAME = 'gallery.json';

const $ = s => document.querySelector(s);
function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids.filter(k => k !== undefined && k !== null && k !== false));
  return n;
}
function fmtTime(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = Math.floor(sec % 60);
  const mmss = `${String(m).padStart(h ? 2 : 1, '0')}:${String(s).padStart(2, '0')}`;
  return h ? `${h}:${mmss}` : mmss;
}
function fmtSize(bytes) {
  return bytes >= 1e9 ? (bytes / 1e9).toFixed(1) + 'GB' : Math.round(bytes / 1e6) + 'MB';
}

// ---------- 인증 ----------
class AuthError extends Error {}
let token = null, tokenExp = 0, tokenScopes = '', tokenClient = null;

function clientId() { return CLIENT_ID || localStorage.getItem('clientId') || ''; }

function loadGis() {
  return new Promise((resolve, reject) => {
    const s = el('script', { src: 'https://accounts.google.com/gsi/client', onload: resolve, onerror: reject });
    document.head.append(s);
  });
}

// extraScope: 기본 권한에 더해 요청할 권한 (이미 허용한 권한은 그대로 유지됨)
function requestToken(extraScope) {
  return new Promise((resolve, reject) => {
    tokenClient.callback = r => {
      if (r.error) return reject(new Error(r.error_description || r.error));
      token = r.access_token;
      tokenExp = Date.now() + (r.expires_in - 60) * 1000;
      tokenScopes = r.scope || '';
      sessionStorage.setItem('tok', JSON.stringify({ token, tokenExp, tokenScopes }));
      resolve();
    };
    tokenClient.error_callback = e => reject(new Error(e.message || e.type));
    tokenClient.requestAccessToken(extraScope ? { prompt: '', scope: SCOPES + ' ' + extraScope } : { prompt: '' });
  });
}

function hasScope(scope) { return tokenScopes.split(' ').includes(scope); }

// 드라이브 수정 권한이 없으면 추가로 받는다(구글 확인 창). 받았으면 true
async function ensureWriteScope() {
  if (hasScope(SCOPE_WRITE)) return true;
  try { await requestToken(SCOPE_WRITE); } catch (e) { showPreviewMessage('권한을 받지 못했어요: ' + e.message); return false; }
  if (hasScope(SCOPE_WRITE)) return true;
  showPreviewMessage('구글 확인 창에서 "Google Drive 파일 보기·수정·생성·삭제" 권한을 체크해야 이름 바꾸기·휴지통 기능을 쓸 수 있어요.');
  return false;
}

function restoreToken() {
  try {
    const t = JSON.parse(sessionStorage.getItem('tok') || 'null');
    if (t && t.tokenExp > Date.now()) ({ token, tokenExp, tokenScopes = '' } = t);
  } catch {}
}

function showLoggedOut(msg) {
  token = null;
  sessionStorage.removeItem('tok');
  if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({});
  $('#grid').replaceChildren();
  $('#login').hidden = false;
  $('#authBtn').hidden = true;
  $('#editBtn').hidden = true;
  setEditMode(false);
  setStatus(msg || '');
}

// 수정 모드: ON 이면 영상 창에 썸네일 수정 버튼들이 보인다. 기본 OFF.
// ON 은 이 탭을 닫거나 로그아웃할 때까지 유지 (새로고침해도 유지)
function setEditMode(on) {
  if (on) sessionStorage.setItem('editMode', '1'); else sessionStorage.removeItem('editMode');
  document.body.classList.toggle('editing', on);
  if (!on && restorePending) restorePending(); // 대기 중이던 [바꾸기] 취소
  renderEditBtn();
  syncAutoPause();
  if (on && viewer.open && viewerUI && viewerUI.startCands) viewerUI.startCands(); // 창을 연 채 수정을 켜면 대표 장면 시작
  if (on) prefetchCandidates();
}

// 확장에 수정 ON/OFF 를 알림 → ON 이면 영상을 클릭해 재생하는 순간 바로 멈춤 (⏯ 로 재생한 건 제외)
function syncAutoPause() {
  if (extReady) extCall('autoPause', { on: document.body.classList.contains('editing') }).catch(() => {});
}

// 확장 프로그램이 없으면 📸에 화면 공유 허용이 필요하다. 영상 창을 열기 전에 위쪽 수정 버튼에서 받아 두면
// 크롬 허용 창(화면 위쪽)으로 마우스가 오갈 때 플레이어 위를 지나가지 않는다.
function needsShare() {
  return document.body.classList.contains('editing') && !extReady && !shareSession
    && !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
}

// 수정 버튼: OFF → (공유 허용 전) 🔓 허용 + 아래 안내 → ON
function renderEditBtn(note) {
  const on = document.body.classList.contains('editing'), ask = needsShare(), b = $('#editBtn');
  b.textContent = ask ? '🔓 화면 캡처 허용' : on ? '✏️ 수정 ON' : '✏️ 수정 OFF';
  b.className = on ? 'primary' : '';
  $('#editNote').hidden = !ask || b.hidden;
  if (ask) $('#editNote').replaceChildren(
    el('div', { textContent: note || '📸 캡처를 위해 이 탭 화면 공유를 한 번 허용해 주세요. 위 버튼을 누르면 크롬 위쪽에 창이 떠요 → "이 탭" 확인 후 [공유]. 이 탭을 닫거나 새로고침하기 전까지 다시 묻지 않아요.' }),
    el('button', { textContent: '수정 끄기', onclick: () => setEditMode(false) }));
}

async function api(url, opts = {}) {
  if (!token || Date.now() > tokenExp) throw new AuthError('로그인이 만료됐어요. 다시 로그인해 주세요.');
  const res = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + token, ...(opts.headers || {}) } });
  if (res.status === 401) throw new AuthError('로그인이 만료됐어요. 다시 로그인해 주세요.');
  if (!res.ok) throw new Error(`드라이브 요청 실패 (${res.status})`);
  return res;
}

// ---------- 썸네일 저장소 (내 드라이브의 숨김 앱 폴더, gallery.json) ----------
let gallery = { videos: {} }, galleryFileId = null;
// 아직 드라이브에 못 쓴 변경 (영상 ID → 새 항목, null = 삭제). 화면에는 이미 반영돼 있다.
const pendingSaves = new Map();
let saving = false, saveError = '', retryTimer = null;

async function readRemote() {
  const p = new URLSearchParams({ spaces: 'appDataFolder', q: `name = '${GALLERY_NAME}'`, fields: 'files(id)' });
  const { files } = await (await api(`${DRIVE}/files?${p}`)).json();
  if (!files.length) return { fileId: null, data: { videos: {} } };
  const data = await (await api(`${DRIVE}/files/${files[0].id}?alt=media`)).json();
  data.videos = data.videos || {};
  return { fileId: files[0].id, data };
}

function applyChanges(data, changes) {
  for (const [id, entry] of changes) { if (entry) data.videos[id] = entry; else delete data.videos[id]; }
}

async function loadGallery() {
  ({ fileId: galleryFileId, data: gallery } = await readRemote());
  applyChanges(gallery, pendingSaves); // 아직 저장 중인 변경은 화면에 그대로 유지
}

// 썸네일 변경(entry 가 null 이면 지정 해제): 화면엔 바로 반영하고, 드라이브 저장은 뒤에서 순서대로 처리
function saveEntry(fileId, entry) {
  if (entry) gallery.videos[fileId] = entry; else delete gallery.videos[fileId];
  pendingSaves.set(fileId, entry);
  renderGrid();
  flushSaves();
}

// 대기 중인 변경을 한 번에 모아 저장. 저장 중에 새로 들어온 변경은 끝난 뒤 이어서 저장.
async function flushSaves() {
  if (saving || !pendingSaves.size) return renderSaveState();
  saving = true;
  clearTimeout(retryTimer);
  renderSaveState();
  const batch = new Map(pendingSaves);
  try {
    const { fileId, data } = await readRemote(); // 다른 기기에서 바뀐 내용을 덮어쓰지 않도록 최신본 위에 반영
    applyChanges(data, batch);
    const body = JSON.stringify(data);
    if (fileId) {
      await api(`${UPLOAD}/files/${fileId}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
      galleryFileId = fileId;
    } else {
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify({ name: GALLERY_NAME, parents: ['appDataFolder'] })], { type: 'application/json' }));
      form.append('file', new Blob([body], { type: 'application/json' }));
      galleryFileId = (await (await api(`${UPLOAD}/files?uploadType=multipart&fields=id`, { method: 'POST', body: form })).json()).id;
    }
    // 저장하는 사이 같은 영상이 또 바뀌지 않았으면 대기열에서 뺌
    for (const [id, entry] of batch) if (pendingSaves.get(id) === entry) pendingSaves.delete(id);
    saveError = '';
  } catch (e) {
    if (e instanceof AuthError) {
      saveError = '로그인이 만료돼 저장을 멈췄어요. 다시 로그인하면 이어서 저장해요.';
    } else {
      saveError = '저장하지 못했어요. 잠시 뒤 다시 시도해요.';
      retryTimer = setTimeout(flushSaves, 5000);
    }
  } finally {
    saving = false;
  }
  if (!saveError && pendingSaves.size) return flushSaves();
  renderSaveState();
}

function renderSaveState() {
  const n = pendingSaves.size, s = $('#saveState');
  s.textContent = saveError ? `⚠️ ${saveError}${n ? ` (${n}개 남음)` : ''}` : n ? `💾 저장 중… ${n}개` : '';
  s.className = saveError ? 'error' : '';
}

// 저장이 남아 있으면 탭을 닫기 전에 한 번 확인
window.addEventListener('beforeunload', e => { if (pendingSaves.size) { e.preventDefault(); e.returnValue = ''; } });

// ---------- 폴더 탐색 ----------
let path = [{ id: 'root', name: '내 드라이브' }];
let items = [];
try { const saved = JSON.parse(localStorage.getItem('path') || 'null'); if (Array.isArray(saved) && saved.length) path = saved; } catch {}

async function listFolder(id) {
  const q = `'${id}' in parents and trashed = false and (mimeType = 'application/vnd.google-apps.folder' or mimeType contains 'video/')`;
  const fields = 'nextPageToken,files(id,name,mimeType,thumbnailLink,size,videoMediaMetadata(durationMillis))';
  const out = [];
  let pageToken = '';
  do {
    const p = new URLSearchParams({ q, fields, pageSize: '1000', orderBy: 'folder,name' });
    if (pageToken) p.set('pageToken', pageToken);
    const data = await (await api(`${DRIVE}/files?${p}`)).json();
    out.push(...data.files);
    pageToken = data.nextPageToken;
  } while (pageToken);
  return out;
}

function setStatus(msg, isError) {
  const s = $('#status');
  s.textContent = msg;
  s.className = isError ? 'error' : '';
}

function renderCrumbs() {
  $('#crumbs').replaceChildren(...path.flatMap((p, i) => [
    i ? el('span', { textContent: '›' }) : null,
    el('a', { textContent: p.name, onclick: () => { path = path.slice(0, i + 1); openFolder(); } }),
  ]).filter(Boolean));
}

async function openFolder() {
  localStorage.setItem('path', JSON.stringify(path));
  renderCrumbs();
  $('#grid').replaceChildren();
  setStatus('불러오는 중…');
  try {
    items = await listFolder(path[path.length - 1].id);
    setStatus(items.length ? '' : '이 폴더에는 영상이나 하위 폴더가 없어요.');
    renderGrid();
  } catch (e) { handleError(e); }
}

function renderGrid() {
  $('#grid').replaceChildren(...items.map(f => f.mimeType === 'application/vnd.google-apps.folder' ? folderCard(f) : videoCard(f)));
  prefetchCandidates(); // 썸네일이 정해질 때마다 "다음 2개"가 바뀜
}

function folderCard(f) {
  return el('button', { className: 'card', onclick: () => { path.push({ id: f.id, name: f.name }); openFolder(); } },
    el('div', { className: 'thumb' }, el('span', { className: 'icon', textContent: '📁' })),
    el('div', { className: 'name', textContent: f.name, title: f.name }));
}

function videoCard(f) {
  const custom = gallery.videos[f.id];
  const thumb = el('div', { className: 'thumb' });
  const src = custom ? custom.thumb : (f.thumbnailLink ? f.thumbnailLink.replace(/=s\d+$/, '=s480') : '');
  if (src) {
    const img = el('img', { src, alt: '', loading: 'lazy', referrerPolicy: 'no-referrer' });
    img.onerror = () => img.replaceWith(el('span', { className: 'icon', textContent: '🎞️' }));
    thumb.append(img);
  } else {
    thumb.append(el('span', { className: 'icon', textContent: '🎞️' }));
  }
  if (custom) thumb.append(el('span', { className: 'badge pin', textContent: '📌' + (typeof custom.t === 'number' ? ' ' + fmtTime(custom.t) : '') }));
  const dur = f.videoMediaMetadata && +f.videoMediaMetadata.durationMillis;
  if (dur) thumb.append(el('span', { className: 'badge', textContent: fmtTime(dur / 1000) }));
  return el('button', { className: 'card', onclick: () => openViewer(f) },
    thumb, el('div', { className: 'name', textContent: f.name, title: f.name }));
}

function handleError(e) {
  if (e instanceof AuthError) showLoggedOut(e.message);
  else setStatus(e.message || String(e), true);
}

// ---------- 재생 / 썸네일 지정 ----------
const viewer = $('#viewer');
let viewerAbort = null;
let viewerUI = null; // 지금 열린 영상 창의 { captureBtn, imageBtn }

let viewerPoll = null; // 시간 조절바 갱신 타이머

function closeViewerResources() {
  if (viewerAbort) { viewerAbort.abort(); viewerAbort = null; }
  clearInterval(viewerPoll);
  restorePending = null;
  // 스트리밍 중인 영상의 추가 다운로드 중단
  for (const v of $('#vBody').querySelectorAll('video')) { v.removeAttribute('src'); v.load(); }
  $('#vBody').replaceChildren();
}

// 서비스 워커(sw.js)를 준비하고 현재 토큰을 넘긴다. 쓸 수 없으면 false.
async function streamReady() {
  if (!('serviceWorker' in navigator) || !token) return false;
  try {
    await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) {
      await Promise.race([
        new Promise(r => navigator.serviceWorker.addEventListener('controllerchange', r, { once: true })),
        new Promise(r => setTimeout(r, 3000)),
      ]);
    }
    if (!navigator.serviceWorker.controller) return false;
    navigator.serviceWorker.controller.postMessage({ token, exp: tokenExp });
    return true;
  } catch { return false; }
}
// close 이벤트는 비동기로 오므로, 그사이 다시 열렸으면 새 내용을 지우지 않는다
viewer.addEventListener('close', () => { if (!viewer.open) { closeViewerResources(); prefetchCandidates(); } });
$('#vClose').onclick = () => viewer.close();

let viewerFile = null;

function openViewer(f) {
  closeViewerResources();
  viewerFile = f;
  $('#vTitle').textContent = f.name;
  $('#vTitle').onclick = () => { if (document.body.classList.contains('editing')) startRename(f); }; // 수정 ON: 이름 바꾸기
  const custom = gallery.videos[f.id];
  const iframe = el('iframe', { className: 'frame', src: `https://drive.google.com/file/d/${f.id}/preview`, allow: 'autoplay; fullscreen', allowFullscreen: true });
  const fileInput = el('input', { type: 'file', accept: 'image/*', hidden: true });
  fileInput.onchange = () => { if (fileInput.files[0]) previewImage(f, fileInput.files[0], imageBtn); };
  const canCapture = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
  // edit-only: 수정 모드(ON)에서만 보임
  const captureBtn = el('button', { className: 'primary edit-only', textContent: CAPTURE_LABEL });
  captureBtn.onclick = () => captureFrame(f, iframe, captureBtn);
  const imageBtn = el('button', { className: 'edit-only', textContent: '🖼️ 이미지로 지정', onclick: () => fileInput.click() });
  const playerWrap = el('div', { className: 'player-wrap' }, iframe); // 영역 조절기가 이 위에 겹쳐 뜸
  viewerUI = { captureBtn, imageBtn, playerWrap };
  // 확장 프로그램이 있으면 드라이브 플레이어를 직접 조작하는 버튼 (수정 모드에서)
  const playerState = el('span', { className: 'time' }); // ⏸/▶ 와 현재 시간 / 전체 길이
  // 항상 보이는 시간 조절바 (드라이브 플레이어 조절바는 숨었다 나왔다 하므로)
  const seekBar = el('input', { type: 'range', min: 0, max: 0, step: 0.1, value: 0, disabled: true, className: 'seek-bar' });
  let dragging = false, seekTimer = null;
  const cands = el('div', { className: 'cands edit-only' }); // 대표 장면 5개
  const showState = r => {
    if (r.duration) { seekBar.max = r.duration; seekBar.disabled = false; }
    if (!dragging) seekBar.value = r.time;
    playerState.textContent = (r.paused ? '⏸ ' : '▶ ') + fmtTenth(r.time) + (r.duration ? ' / ' + fmtTime(r.duration) : '');
  };
  const send = (action, delta) => extCall('player', { action, delta })
    .then(r => { showState(r); $('#preview').replaceChildren(); })
    .catch(e => showPreviewMessage(e.message));
  // ⏯ 는 한 번씩, ±이동 버튼은 꾹 누르면 연속으로
  const pc = (label, action, delta) => action === 'seek'
    ? holdRepeat(el('button', { textContent: label }), () => send(action, delta))
    : el('button', { textContent: label, onclick: () => send(action, delta) });
  const seekTo = () => extCall('player', { action: 'seekTo', delta: +seekBar.value }).then(showState).catch(() => {});
  seekBar.oninput = () => {
    dragging = true;
    playerState.textContent = '⏸ ' + fmtTenth(+seekBar.value);
    if (!seekTimer) seekTimer = setTimeout(() => { seekTimer = null; seekTo(); }, 120); // 끄는 동안 0.12초마다 이동
  };
  seekBar.onchange = () => { dragging = false; clearTimeout(seekTimer); seekTimer = null; seekTo(); };
  // 영상이 재생되면서 움직이는 시간을 1초마다 반영 (수정 모드 + 확장 있을 때만)
  viewerPoll = setInterval(() => {
    if (!dragging && viewer.open && document.body.classList.contains('editing') && extReady) {
      extCall('player', { action: 'state' }).then(showState).catch(() => {});
    }
  }, 1000);
  $('#vBody').replaceChildren(

    el('div', { className: 'row edit-only ext-only' }, seekBar),
    el('div', { className: 'row edit-only ext-only' },

      pc('+1프레임', 'seek', 1 / 30), pc('+1초', 'seek', 1), playerState),
    el('div', { className: 'row' },
      canCapture ? captureBtn : null,
      imageBtn,
      el('button', { className: 'edit-only', textContent: '🎯 시간으로 지정', onclick: () => openEditor(f) }),
      el('a', { className: 'btn', href: `https://drive.google.com/file/d/${f.id}/view`, target: '_blank', rel: 'noopener', textContent: '드라이브에서 열기' }),
      custom ? el('button', { className: 'edit-only', textContent: '기본 썸네일로 되돌리기', onclick: () => resetThumb(f) }) : null),
    cands,
    fileInput,
    el('div', { id: 'preview', className: 'edit-only' }),
    el('p', { className: 'hint edit-only ext-only', textContent: '영상을 클릭하면 불러온 뒤 바로 멈춰요(계속 보려면 ⏯). 시간선·버튼으로 장면을 맞추고 "📸 지금 화면으로 지정" → 플레이어 컨트롤 없이 바로 찍혀요.' }),
    el('p', { className: 'hint edit-only no-ext-only', textContent: canCapture
      ? '원하는 장면에서 멈추고 컨트롤이 내려간 상태로 "📸 지금 화면으로 지정" → 바로 찍혀요. 직접 찍은 스크린샷을 붙여넣기(Ctrl+V)해도 돼요. 확장 프로그램을 설치하면 공유 허용 없이 컨트롤도 자동으로 숨기고 찍어요.'
      : '드라이브 앱에서 원하는 장면을 스크린샷으로 찍은 뒤 "🖼️ 이미지로 지정"으로 골라 주세요.' }),
    el('div', { className: 'row end edit-only' }, trashButton(f)));
  viewer.showModal();
  // 수정 ON + 확장: 창을 열면 영상을 자동으로 불러옴(재생 → 0.3초 뒤 자동 멈춤) → 시간 조절바가 바로 보임.
  // 플레이어가 준비되는 데 시간이 걸려 1.2초 뒤부터 확인하고, 아직이면 재생 버튼을 다시 누름(최대 4번)
  iframe.addEventListener('load', async () => {

      if (!viewer.open || viewerFile !== f || !extReady || !document.body.classList.contains('editing')) return;
      const st = await extCall('player', { action: 'state' }).catch(() => null);
      if (st && st.duration) return showState(st); // 이미 불러와짐
      await extCall('player', { action: 'kick' }).catch(() => {});
    }
  }, { once: true });
  // 대표 장면: 수정 ON 이면 바로, 창을 연 채 수정을 켜면 그때 (미리 뽑아 둔 게 있으면 즉시 보임)
  viewerUI.startCands = () => { if (!cands.hasChildNodes()) showCandidates(f, iframe, cands, captureBtn); };
  if (document.body.classList.contains('editing')) viewerUI.startCands();

// ---------- 영상 휴지통으로 ----------
// 🗑️ 를 누르면 그 자리에서 [취소] [🗑️ 휴지통으로 이동]으로 바뀌고, 한 번 더 누르면 드라이브 휴지통으로 옮김(30일 안에 복원 가능).
// 창은 바로 닫히고 목록에서도 바로 빠지며, 실제 이동은 뒤에서. 실패하면 목록에 되돌려 놓음.
function trashButton(f) {
  const btn = el('button', { className: 'danger', textContent: '🗑️', title: '드라이브 휴지통으로 이동' });
  const cancel = el('button', { textContent: '취소' });
  let armed = false;
  cancel.onclick = () => { btn.textContent = '🗑️'; cancel.remove(); armed = false; };
  btn.onclick = async () => {
    if (!armed) {
      armed = true;
      btn.textContent = '🗑️ 휴지통으로 이동';
      btn.before(cancel);
      return;
    }
    if (!await ensureWriteScope()) return;
    trashVideo(f);
    viewer.close();
  };
  return btn;
}

async function trashVideo(f) {
  const at = items.findIndex(x => x.id === f.id);
  if (at >= 0) items.splice(at, 1);
  renderGrid();
  setStatus(`"${f.name}"을(를) 휴지통으로 옮기는 중…`);
  try {
    await api(`${DRIVE}/files/${f.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true }) });
    if (gallery.videos[f.id]) saveEntry(f.id, null); // 지정해 둔 썸네일도 정리
    setStatus(`"${f.name}"을(를) 드라이브 휴지통으로 옮겼어요. (30일 안에 드라이브 휴지통에서 복원 가능)`);
  } catch (e) {
    if (at >= 0 && !items.some(x => x.id === f.id)) items.splice(Math.min(at, items.length), 0, f);
    renderGrid();
    setStatus(`"${f.name}"을(를) 휴지통으로 옮기지 못했어요: ${e.message}`, true);
  }
}

// ---------- 영상 이름 바꾸기 ----------
// 수정 ON 에서 창 위쪽 이름을 누르면 입력칸으로 바뀜(확장자 앞까지 선택). Enter·다른 곳 클릭 = 저장, Esc = 취소.
// 이름은 바로 바뀌어 보이고 드라이브 반영은 뒤에서. 실패하면 원래 이름으로.
function startRename(f) {
  const title = $('#vTitle');
  if (title.querySelector('input')) return;
  const input = el('input', { value: f.name, spellcheck: false });
  title.replaceChildren(input);
  input.focus();
  const dot = f.name.lastIndexOf('.');
  input.setSelectionRange(0, dot > 0 ? dot : f.name.length);
  let done = false;
  const finish = async save => {
    if (done) return;
    done = true;
    const name = input.value.trim();
    title.textContent = f.name;
    if (!save || !name || name === f.name) return;
    if (!await ensureWriteScope()) return;
    renameVideo(f, name);
  };
  input.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); } // 창이 닫히지 않게
  };
  input.onblur = () => finish(true);
}

async function renameVideo(f, name) {
  const old = f.name;
  f.name = name;
  renderGrid();
  if (viewer.open && viewerFile === f) $('#vTitle').textContent = name;
  try {
    await api(`${DRIVE}/files/${f.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
  } catch (e) {
    if (f.name === name) {
      f.name = old;
      renderGrid();
      if (viewer.open && viewerFile === f && !$('#vTitle input')) $('#vTitle').textContent = old;
    }
    setStatus(`이름을 바꾸지 못했어요: ${e.message}`, true);
  }
}

// 브라우저는 화면 공유 권한을 저장하지 않으므로, 한 번 허용받은 공유를 페이지를 닫을 때까지 유지해
// 다른 영상이나 다시 찍을 때 또 묻지 않는다 (사용자가 "공유 중지"를 누르면 다음에 다시 물음)
const CAPTURE_LABEL = '📸 지금 화면으로 지정';
let shareSession = null; // { stream, track, video, croppedTo }

// 공유 화면에서 플레이어 영역 [sx, sy, sw, sh]
function playerRect(iframe, cropped, video) {
  if (cropped) return [0, 0, video.videoWidth, video.videoHeight];
  const r = iframe.getBoundingClientRect(), k = video.videoWidth / window.innerWidth;
  return [r.left * k, r.top * k, r.width * k, r.height * k];
}

// 이 탭 화면 공유를 시작한다 (크롬 허용 창). 실패하면 이유 문자열, 성공하면 null
async function startShare() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: 'browser' }, audio: false,
      preferCurrentTab: true, selfBrowserSurface: 'include', surfaceSwitching: 'exclude' });
  } catch { return '허용하지 않았어요.'; } // 공유 창에서 취소
  const [track] = stream.getVideoTracks();
  if (track.getSettings().displaySurface !== 'browser') {
    stream.getTracks().forEach(t => t.stop());
    return '공유 창에서 "이 탭"을 골라 주세요.';
  }
  const video = el('video', { muted: true, playsInline: true });
  video.srcObject = stream;
  await video.play();
  shareSession = { stream, track, video };
  // 브라우저의 "공유 중지"를 누르면 다음엔 다시 묻기
  track.addEventListener('ended', () => {
    if (shareSession && shareSession.stream === stream) { shareSession = null; renderEditBtn(); }
  });
  renderEditBtn();
  return null;
}

// 확장으로 탭 화면을 찍어(찍는 순간 플레이어 컨트롤 숨김) 플레이어(iframe) 영역만 잘라 캔버스로
async function extShot(iframe) {
  const { dataUrl } = await extCall('capture');
  const img = await createImageBitmap(await (await fetch(dataUrl)).blob());
  const r = iframe.getBoundingClientRect(), k = img.width / window.innerWidth;
  const c = el('canvas', { width: Math.round(r.width * k), height: Math.round(r.height * k) });
  c.getContext('2d').drawImage(img, r.left * k, r.top * k, r.width * k, r.height * k, 0, 0, c.width, c.height);
  img.close();
  return c;
}

// ---------- 대표 장면 5개 (영상 길이의 25·33·50·66·75%) ----------
// 드라이브 영상 파일에서 직접 뽑는다(그 지점 근처만 받음). 보고 있는 플레이어는 건드리지 않음.
// 수정 ON 이면 지금 폴더 순서에서 아직 썸네일을 안 정한 앞쪽 영상 2개를 미리 뽑아 두고,
// 영상 창을 열면 뽑아 둔 것(또는 뽑히는 대로)을 보여준다. 누르면 그 장면으로 바로 적용(창 닫힘, 저장은 뒤에서).
const CAND_POINTS = [0.25, 1 / 3, 0.5, 2 / 3, 0.75];
const candJobs = new Map(); // 영상 ID → { f, status, dur, shots[], subs, ac }
let candRunning = false;

function candJob(f) {
  let j = candJobs.get(f.id);
  if (!j) {
    j = { f, status: 'queued', dur: 0, shots: [], subs: new Set(), ac: new AbortController() };
    candJobs.set(f.id, j);
  }
  return j;
}

function notifyCand(j) { for (const fn of [...j.subs]) fn(); }

// 한 번에 한 영상씩. 지금 열려 있는 영상이 기다리고 있으면 그것부터.
async function runCandJobs() {
  if (candRunning) return;
  candRunning = true;
  try {
    for (;;) {
      const opened = viewer.open && viewerFile && candJobs.get(viewerFile.id);
      const j = opened && opened.status === 'queued' ? opened : [...candJobs.values()].find(x => x.status === 'queued');
      if (!j) break;
      j.status = 'running';
      notifyCand(j);
      try {
        j.status = await extractCandidates(j) ? 'done' : 'unsupported';
      } catch (e) {
        if (e instanceof AuthError) { j.status = 'queued'; notifyCand(j); break; } // 다시 로그인하면 이어서
        j.status = j.ac.signal.aborted ? 'aborted' : 'unsupported';
      }
      notifyCand(j);
    }
  } finally {
    candRunning = false;
  }
}

// 이 브라우저가 풀 수 없는 형식이면 false
async function extractCandidates(j) {
  const { f } = j, size = +f.size || 0, signal = j.ac.signal;
  if (!size || !('VideoDecoder' in window) || !/mp4|quicktime|m4v|3gpp/.test(f.mimeType)) return false;
  const src = await openMp4(f.id, size, signal);
  if (!src || src.unsupported) return false;
  j.dur = src.duration;
  notifyCand(j);
  let made = 0;
  for (const [i, p] of CAND_POINTS.entries()) {
    if (signal.aborted) throw new DOMException('중단', 'AbortError');
    try {
      const { frame, t } = await extractFrame(src, p * src.duration, signal, true);
      const c = el('canvas');
      drawFrame(c, frame, src.rotation);
      frame.close();
      j.shots[i] = { t, thumb: capture(c, c.width, c.height) };
      made++;
    } catch (e) {
      if (signal.aborted || e instanceof AuthError) throw e;
      j.shots[i] = 'fail';
    }
    notifyCand(j);
  }
  return made > 0;
}

// 수정 ON 일 때: 지금 폴더의 정렬 순서에서 아직 썸네일을 안 정한 앞쪽 영상 2개(+지금 연 영상)만 남기고 미리 뽑기
function prefetchCandidates() {
  if (!document.body.classList.contains('editing') || !token) return;
  const todo = items.filter(x => x.mimeType !== 'application/vnd.google-apps.folder' && !gallery.videos[x.id]).slice(0, 2);
  const keep = new Set(todo.map(x => x.id));
  if (viewer.open && viewerFile) keep.add(viewerFile.id);
  for (const [id, j] of candJobs) {
    if (keep.has(id)) continue;
    j.ac.abort(); // 이미 정했거나 순서에서 밀린 영상은 멈추고 버림
    candJobs.delete(id);
  }
  for (const x of todo) candJob(x);
  runCandJobs();
}

function candSlots(box, dur) {
  box.replaceChildren();
  return CAND_POINTS.map(p => {
    const b = el('button', { className: 'cand', disabled: true }, el('div', { className: 'cand-img' }),
      el('span', { textContent: `${Math.round(p * 100)}% · ${fmtTime(p * dur)}` }));
    box.append(b);
    return b;
  });
}

function fillSlot(f, b, thumb, t) {
  b.firstChild.replaceWith(el('img', { src: thumb, alt: '' }));
  b.disabled = false;
  b.onclick = () => {
    saveEntry(f.id, { t: Math.round(t * 10) / 10, thumb, at: new Date().toISOString() });
    viewer.close();
  };
}

// 영상 창의 대표 장면 칸: 그 영상의 작업 결과를 보여주고, 새 장면이 뽑힐 때마다 채움
function showCandidates(f, iframe, box, captureBtn) {
  const j = candJob(f);
  let slots = null, filled = [];
  const render = () => {
    if (!box.isConnected) return j.subs.delete(render); // 창을 닫았거나 다른 화면으로 바뀜
    if (j.status === 'unsupported' || j.status === 'aborted') {
      j.subs.delete(render);
      return box.replaceChildren(
        el('button', { className: 'ext-only', textContent: '🎞️ 플레이어로 대표 장면 뽑기 (플레이어가 3~4초 움직여요)',
          onclick: () => candidatesFromPlayer(f, iframe, box, captureBtn) }),
        el('p', { className: 'hint no-ext-only', textContent: '이 영상 형식은 대표 장면을 자동으로 뽑을 수 없어요.' }));
    }
    if (!j.dur) {
      return box.replaceChildren(el('p', { className: 'hint', textContent: j.status === 'queued' ? '대표 장면: 앞 영상 다음 차례예요…' : '대표 장면 뽑는 중…' }));
    }
    if (!slots) { slots = candSlots(box, j.dur); filled = []; }
    j.shots.forEach((s, i) => {
      if (!s || filled[i]) return;
      filled[i] = true;
      if (s === 'fail') slots[i].lastChild.textContent += ' · 실패';
      else fillSlot(f, slots[i], s.thumb, s.t);
    });
  };
  j.subs.add(render);
  render();
  runCandJobs();
}

// 파일에서 못 뽑는 형식일 때(확장 필요, 누를 때만): 플레이어를 각 지점으로 옮겨 찍고 원래 위치로 돌아감
async function candidatesFromPlayer(f, iframe, box, captureBtn) {
  let start = null;
  try { start = await extCall('player', { action: 'state' }); } catch {}
  if (!start || !start.duration) return showPreviewMessage('영상을 한 번 클릭해 불러온 뒤 눌러 주세요.');
  const dur = start.duration, back = start.time, mine = viewerFile;
  const alive = () => viewer.open && viewerFile === mine;
  const slots = candSlots(box, dur);
  captureBtn.disabled = true; // 찍는 동안 📸 와 겹치지 않게
  let last = 0;
  try {
    for (const [i, p] of CAND_POINTS.entries()) {
      if (!alive()) return;
      await extCall('player', { action: 'seekToWait', delta: p * dur });
      const wait = 550 - (performance.now() - last); // 크롬 탭 캡처는 초당 2번까지
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
      if (!alive()) return;
      const shot = await extShot(iframe);
      last = performance.now();
      const r = contentRect(shot); // 플레이어의 검은 여백 제외
      const c = el('canvas', { width: r.w, height: r.h });
      c.getContext('2d').drawImage(shot, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
      fillSlot(f, slots[i], capture(c, r.w, r.h), p * dur);
    }
  } catch (e) {
    if (alive()) showPreviewMessage('대표 장면을 뽑지 못했어요: ' + e.message);
  } finally {
    if (alive()) {
      captureBtn.disabled = false;
      extCall('player', { action: 'seekTo', delta: back }).catch(() => {});
    }
  }
}

// 확장 프로그램으로 캡처: 공유 허용 없이, 찍는 순간 플레이어 컨트롤을 숨기고 탭 화면을 찍어 플레이어 영역만 잘라냄
async function captureViaExt(f, iframe, btn) {
  btn.disabled = true;
  $('#preview').replaceChildren();
  try {
    askThumb(f, await extShot(iframe), btn);
  } catch (e) {
    showPreviewMessage('캡처하지 못했어요: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

// 📸 누름 → 바로 이 탭 화면을 한 프레임 캡처해 플레이어(iframe) 영역만 잘라낸다.
async function captureFrame(f, iframe, btn) {
  if (btn.disabled) return;
  if (extReady) return captureViaExt(f, iframe, btn);
  if (!shareSession) {
    const why = await startShare();
    if (why) return showPreviewMessage(why);
  }
  // 지금 열린 영상의 플레이어 영역만 잘라 받기. 영상마다 iframe 이 새로 생기므로 바뀌었을 때만 다시 지정
  let cropped = false;
  if (window.CropTarget && shareSession.track.cropTo) {
    if (shareSession.croppedTo !== iframe) {
      try { await shareSession.track.cropTo(await CropTarget.fromElement(iframe)); } catch {
        // 자르기는 이 탭을 공유할 때만 됨 → 다른 탭을 고른 것
        shareSession.stream.getTracks().forEach(t => t.stop());
        shareSession = null;
        renderEditBtn();
        return showPreviewMessage('다른 탭이 공유됐어요. 📸를 다시 누르고 공유 창에서 "이 탭"을 골라 주세요.');
      }
      shareSession.croppedTo = iframe;
      // 잘린 첫 프레임이 들어올 때까지만 (최대 0.3초)
      const v = shareSession.video;
      await new Promise(r => { if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => r()); setTimeout(r, 300); });
    }
    cropped = true;
  }
  $('#preview').replaceChildren();
  btn.disabled = true;
  try {
    const { video } = shareSession;
    const [sx, sy, sw, sh] = playerRect(iframe, cropped, video);
    const c = el('canvas', { width: Math.round(sw), height: Math.round(sh) });
    c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
    askThumb(f, c, btn);
  } catch (e) {
    showPreviewMessage('캡처하지 못했어요: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function previewImage(f, blob, btn) {
  try {
    const bmp = await createImageBitmap(blob);
    const w = Math.min(1280, bmp.width), h = Math.round(bmp.height * w / bmp.width);
    const c = el('canvas', { width: w, height: h });
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    bmp.close();
    askThumb(f, c, btn);
  } catch { showPreviewMessage('이미지를 열지 못했어요.'); }
}

function showPreviewMessage(text) {
  $('#preview').replaceChildren(el('p', { className: 'hint', textContent: text }));
}

// 영상 둘레의 검은 여백(세로 영상 양옆 등)을 뺀 실제 영상 영역 {x, y, w, h}. 못 찾으면 전체.
function contentRect(canvas) {
  const { width: W, height: H } = canvas;
  const d = canvas.getContext('2d').getImageData(0, 0, W, H).data;
  const bright = (x, y) => { const i = (y * W + x) * 4; return d[i] + d[i + 1] + d[i + 2] > 60; };
  // 한 줄(행/열)에서 밝은 점이 2% 넘게 있으면 영상이 있는 줄
  const rowHas = y => { let n = 0, c = 0; for (let x = 0; x < W; x += 4) { c++; if (bright(x, y)) n++; } return n > c * 0.02; };
  const colHas = x => { let n = 0, c = 0; for (let y = 0; y < H; y += 4) { c++; if (bright(x, y)) n++; } return n > c * 0.02; };
  // 캡처 가장자리 1~2px 은 잘라낸 경계에 섞인 색이 남을 수 있어 건너뛰고 찾는다 (영상이 끝까지 차 있으면 다시 0까지)
  const E = 2;
  let top = E, bottom = H - 1 - E, left = E, right = W - 1 - E;
  while (top < bottom && !rowHas(top)) top++;
  while (bottom > top && !rowHas(bottom)) bottom--;
  while (left < right && !colHas(left)) left++;
  while (right > left && !colHas(right)) right--;
  if (top === E) top = 0;
  if (left === E) left = 0;
  if (bottom === H - 1 - E) bottom = H - 1;
  if (right === W - 1 - E) right = W - 1;
  const r = { x: left, y: top, w: right - left + 1, h: bottom - top + 1 };
  return r.w * r.h < W * H * 0.15 ? { x: 0, y: 0, w: W, h: H } : r; // 거의 다 검으면 전체
}

// 플레이어 자리에 찍힌 화면을 겹쳐 띄우고, 그 위에 끌어서 조절하는 영역 상자를 둔다.
// 반환: { rect() 지금 상자(캔버스 픽셀 기준), remove() }
function openCropper(canvas) {
  const W = canvas.width, H = canvas.height;
  const box = el('div', { className: 'crop-box' });
  const dirs = { nw: [0, 0], n: [50, 0], ne: [100, 0], e: [100, 50], se: [100, 100], s: [50, 100], sw: [0, 100], w: [0, 50] };
  for (const [dir, [x, y]] of Object.entries(dirs)) {
    const h = el('i');
    h.dataset.dir = dir;
    Object.assign(h.style, { left: x + '%', top: y + '%', cursor: dir + '-resize' });
    box.append(h);
  }
  const ov = el('div', { className: 'cropper' }, canvas, box);
  viewerUI.playerWrap.append(ov);
  let r = contentRect(canvas), scale = 1, ox = 0, oy = 0;
  const render = () => {
    scale = Math.min(ov.clientWidth / W, ov.clientHeight / H);
    ox = (ov.clientWidth - W * scale) / 2;
    oy = (ov.clientHeight - H * scale) / 2;
    Object.assign(canvas.style, { left: ox + 'px', top: oy + 'px', width: W * scale + 'px', height: H * scale + 'px' });
    Object.assign(box.style, { left: ox + r.x * scale + 'px', top: oy + r.y * scale + 'px', width: r.w * scale + 'px', height: r.h * scale + 'px' });
  };
  const ro = new ResizeObserver(render);
  ro.observe(ov);
  render();
  box.addEventListener('pointerdown', e => {
    e.preventDefault();
    box.setPointerCapture(e.pointerId);
    const dir = e.target.dataset.dir || 'move', start = { ...r }, sx = e.clientX, sy = e.clientY, min = 16;
    const onMove = ev => {
      const dx = (ev.clientX - sx) / scale, dy = (ev.clientY - sy) / scale;
      let { x, y, w, h } = start;
      if (dir === 'move') {
        x = Math.min(Math.max(0, x + dx), W - w);
        y = Math.min(Math.max(0, y + dy), H - h);
      } else {
        if (dir.includes('w')) { const nx = Math.min(Math.max(0, x + dx), x + w - min); w += x - nx; x = nx; }
        if (dir.includes('e')) w = Math.min(Math.max(min, w + dx), W - x);
        if (dir.includes('n')) { const ny = Math.min(Math.max(0, y + dy), y + h - min); h += y - ny; y = ny; }
        if (dir.includes('s')) h = Math.min(Math.max(min, h + dy), H - y);
      }
      r = { x, y, w, h };
      render();
    };
    const onUp = () => { box.removeEventListener('pointermove', onMove); box.removeEventListener('pointerup', onUp); };
    box.addEventListener('pointermove', onMove);
    box.addEventListener('pointerup', onUp);
  });
  return {
    rect: () => ({ x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.w), h: Math.round(r.h) }),
    remove: () => { ro.disconnect(); ov.remove(); },
  };
}

// 누른 버튼(📸 / 🖼️)이 그 자리에서 [바꾸기]로 바뀌고 옆에 [취소]가 생긴다 (마우스를 옮길 필요 없음)
// 그동안 플레이어 자리에 영역 조절기가 뜨고, [바꾸기]를 누르면 그 영역만 썸네일로 저장
let restorePending = null; // [바꾸기] 대기 중이면 원래 버튼으로 되돌리는 함수
function askThumb(f, canvas, btn) {
  if (restorePending) restorePending();
  const { textContent: label, className, onclick } = btn;
  const cancel = el('button', { textContent: '취소' });
  const cropper = openCropper(canvas);
  restorePending = () => {
    Object.assign(btn, { textContent: label, className, onclick, disabled: false });
    btn.style.minWidth = '';
    cancel.remove();
    cropper.remove();
    restorePending = null;
  };
  cancel.onclick = restorePending;
  btn.style.minWidth = btn.offsetWidth + 'px'; // 폭을 그대로 둬서 누른 자리에 [바꾸기]가 오게
  Object.assign(btn, { textContent: '✅ 바꾸기', disabled: false });
  btn.classList.add('primary');
  btn.onclick = () => {
    const r = cropper.rect();
    const out = el('canvas', { width: r.w, height: r.h });
    out.getContext('2d').drawImage(canvas, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
    saveEntry(f.id, { t: null, thumb: capture(out, r.w, r.h), at: new Date().toISOString() });
    viewer.close(); // 저장은 뒤에서 — 바로 다음 영상으로
  };
  btn.after(cancel);
}

// 스크린샷 붙여넣기(Ctrl+V)
document.addEventListener('paste', e => {
  if (!viewer.open || !viewerFile || !$('#preview') || !document.body.classList.contains('editing')) return;
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  const { captureBtn, imageBtn } = viewerUI;
  previewImage(viewerFile, item.getAsFile(), captureBtn.isConnected ? captureBtn : imageBtn);
});

function resetThumb(f) {
  saveEntry(f.id, null);
  viewer.close();
}

// ---------- 장면 지정 ----------
// MP4/MOV: 파일 색인(moov)과, 고른 시점이 속한 구간(키프레임~다음 키프레임)만 받아 그 프레임 하나만 디코딩한다.
// 그 외 형식이나 미지원 브라우저: 서비스 워커 스트리밍으로 <video> 탐색.
const MP4BOX_SRC = 'https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js';
const MP4BOX_SRI = 'sha384-9oK16t6TCKqCB5OpB/LwRkNa48prlRFQPTYw8tb9uj699JvQ1wjxIq7YO8Z4hn3a';
let mp4boxLoading = null;
function loadMp4box() {
  return mp4boxLoading = mp4boxLoading || new Promise((resolve, reject) => {
    document.head.append(el('script', { src: MP4BOX_SRC, integrity: MP4BOX_SRI, crossOrigin: 'anonymous', onload: resolve,
      onerror: () => { mp4boxLoading = null; reject(new Error('mp4box 로드 실패')); } }));
  });
}

async function openEditor(f) {
  closeViewerResources();
  const size = +f.size || 0;
  const msg = el('div', { className: 'hint', textContent: '영상 정보를 읽는 중…' });
  $('#vBody').replaceChildren(msg);
  viewerAbort = new AbortController();
  const signal = viewerAbort.signal;
  try {
    if (size && 'VideoDecoder' in window && /mp4|quicktime|m4v|3gpp/.test(f.mimeType)) {
      const src = await openMp4(f.id, size, signal);
      if (src && src.unsupported) return showUnsupported(f);
      if (src) return showFramePicker(f, src);
    }
  } catch (e) {
    if (signal.aborted) return;
    if (e instanceof AuthError) { viewer.close(); return handleError(e); }
    console.warn('프레임 추출 불가, 스트리밍으로 전환:', e);
  }
  if (signal.aborted) return;
  if (size && await streamReady()) {
    return showPicker(f, `stream/${f.id}?size=${size}&type=${encodeURIComponent(f.mimeType)}`);
  }
  msg.textContent = '이 브라우저나 영상 형식에서는 장면 지정을 할 수 없어요. PC 크롬이나 엣지에서 시도해 주세요.';
}

const UNSUPPORTED_MSG = '이 브라우저는 이 영상 형식(아이폰 HEVC 등)을 직접 풀 수 없어요. 재생 화면에서 원하는 장면에 멈추고 "📸 지금 화면으로 지정"이나 "🖼️ 이미지로 지정"을 써 주세요.';

function showUnsupported(f) {
  $('#vBody').replaceChildren(
    el('p', { className: 'hint', textContent: UNSUPPORTED_MSG }),
    el('div', { className: 'row' }, el('button', { className: 'primary', textContent: '← 재생 화면', onclick: () => openViewer(f) })));
}

async function rangeBuf(id, start, end, signal) {
  const res = await api(`${DRIVE}/files/${id}?alt=media`, { headers: { Range: `bytes=${start}-${end}` }, signal });
  if (res.status !== 206) { if (res.body) res.body.cancel(); throw new Error('부분 다운로드를 지원하지 않는 응답'); }
  return res.arrayBuffer();
}

// 최상위 박스 헤더만 훑어 ftyp(파일 형식)와 moov(색인)만 받아 이어 붙인다. mdat(영상 데이터)는 건너뜀.
async function findMoov(id, size, signal) {
  let pos = 0, ftyp = null;
  while (pos + 8 <= size) {
    const head = new DataView(await rangeBuf(id, pos, Math.min(pos + 15, size - 1), signal));
    const type = String.fromCharCode(head.getUint8(4), head.getUint8(5), head.getUint8(6), head.getUint8(7));
    let len = head.getUint32(0);
    if (len === 1) len = Number(head.getBigUint64(8));
    else if (len === 0) len = size - pos;
    if (len < 8) break;
    if (type === 'ftyp') ftyp = await rangeBuf(id, pos, pos + len - 1, signal);
    if (type === 'moov') {
      const moov = await rangeBuf(id, pos, pos + len - 1, signal);
      // 옛 QuickTime(.mov)은 ftyp 가 없을 수 있어 최소 형태로 채움 (mp4box 가 요구)
      if (!ftyp) ftyp = new Uint8Array([0, 0, 0, 20, ...'ftypqt  ', 0, 0, 0, 0, ...'qt  '].map(c => typeof c === 'string' ? c.charCodeAt(0) : c)).buffer;
      const out = new Uint8Array(ftyp.byteLength + moov.byteLength);
      out.set(new Uint8Array(ftyp), 0);
      out.set(new Uint8Array(moov), ftyp.byteLength);
      return out.buffer;
    }
    pos += len;
  }
  throw new Error('영상 색인(moov)을 찾지 못했어요');
}

function decoderDescription(trak) {
  for (const entry of trak.mdia.minf.stbl.stsd.entries) {
    const box = entry.avcC || entry.hvcC || entry.vpcC || entry.av1C;
    if (box) {
      const s = new DataStream(undefined, 0, DataStream.BIG_ENDIAN);
      box.write(s);
      return new Uint8Array(s.buffer, 8); // 박스 헤더 8바이트 제외
    }
  }
}

async function openMp4(id, size, signal) {
  await loadMp4box();
  const moov = await findMoov(id, size, signal);
  const mp4 = MP4Box.createFile();
  let info = null;
  mp4.onReady = i => { info = i; };
  moov.fileStart = 0; // 색인만 따로 파싱 (샘플 위치는 파일 절대 오프셋이라 영향 없음)
  mp4.appendBuffer(moov);
  mp4.flush();
  const track = info && info.videoTracks[0];
  if (!track) return null;
  const trak = mp4.getTrackById(track.id);
  const config = { codec: track.codec, codedWidth: track.video.width, codedHeight: track.video.height, description: decoderDescription(trak) };
  if (!(await VideoDecoder.isConfigSupported(config)).supported) return { unsupported: true };
  const m = track.matrix; // 폰 세로 영상 등의 회전 정보
  const rotation = (Math.round(Math.atan2(m[1], m[0]) * 180 / Math.PI) + 360) % 360;
  return { id, config, rotation, samples: trak.samples, timescale: track.timescale,
    duration: info.duration / info.timescale, cache: new Map() };
}

// t초에 보이는 프레임을 디코딩해 { frame(VideoFrame), t(실제 프레임 시각) } 반환
// onlyNeeded: 그 프레임까지만 받음(한 번만 뽑을 때, 대표 장면용). 아니면 구간 전체를 받아 두고 재사용(미세 이동용)
async function extractFrame(src, t, signal, onlyNeeded) {
  const { samples, timescale } = src;
  const want = t * timescale;
  let target = 0;
  for (let i = 0; i < samples.length; i++) {
    if (samples[i].cts <= want && samples[i].cts >= samples[target].cts) target = i;
  }
  let key = target;
  while (key > 0 && !samples[key].is_sync) key--;
  let next = target + 1;
  while (!onlyNeeded && next < samples.length && !samples[next].is_sync) next++;
  // 키프레임~다음 키프레임 직전(한 구간)을 한 번에 받아 두고, 같은 구간 안 미세 이동은 재사용
  let gop = onlyNeeded ? null : src.cache.get(key);
  if (!gop) {
    let lo = Infinity, hi = 0;
    for (let i = key; i < next; i++) { lo = Math.min(lo, samples[i].offset); hi = Math.max(hi, samples[i].offset + samples[i].size); }
    gop = { lo, buf: await rangeBuf(src.id, lo, hi - 1, signal) };
    if (!onlyNeeded) {
      src.cache.set(key, gop);
      if (src.cache.size > 3) src.cache.delete(src.cache.keys().next().value);
    }
  }
  const us = v => Math.round(v * 1e6 / timescale);
  const wantTs = us(samples[target].cts);
  let best = null;
  const decoder = new VideoDecoder({
    output: frame => { if (frame.timestamp === wantTs) { if (best) best.close(); best = frame; } else frame.close(); },
    error: () => {},
  });
  decoder.configure(src.config);
  for (let i = key; i <= target; i++) {
    const s = samples[i];
    decoder.decode(new EncodedVideoChunk({
      type: s.is_sync ? 'key' : 'delta', timestamp: us(s.cts), duration: us(s.duration),
      data: new Uint8Array(gop.buf, s.offset - gop.lo, s.size),
    }));
  }
  await decoder.flush();
  decoder.close();
  if (!best) throw new Error('프레임을 디코딩하지 못했어요');
  return { frame: best, t: samples[target].cts / timescale };
}

function drawFrame(canvas, frame, rotation) {
  const w = frame.displayWidth, h = frame.displayHeight, swap = rotation % 180 !== 0;
  canvas.width = swap ? h : w;
  canvas.height = swap ? w : h;
  const g = canvas.getContext('2d');
  g.translate(canvas.width / 2, canvas.height / 2);
  g.rotate(rotation * Math.PI / 180);
  g.drawImage(frame, -w / 2, -h / 2, w, h);
}

// 꾹 누르면 반복: 누를 때 한 번 → 0.4초 뒤부터 0.12초마다. 앞 요청이 끝나기 전엔 다음을 보내지 않음
function holdRepeat(btn, fn) {
  let timer = null, busy = false;
  const fire = () => {
    if (busy) return;
    busy = true;
    Promise.resolve(fn()).finally(() => { busy = false; });
  };
  const stop = () => { clearTimeout(timer); timer = null; };
  btn.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    stop();
    fire();
    timer = setTimeout(function repeat() { fire(); timer = setTimeout(repeat, 120); }, 400);
  });
  for (const t of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(t, stop);
  btn.addEventListener('click', e => { if (e.detail === 0) fire(); }); // 키보드(Enter/Space)로 누른 경우
  return btn;
}

function fmtTenth(t) { const d = Math.round(t * 10); return fmtTime(Math.floor(d / 10)) + '.' + (d % 10); }
function parseTime(str) {
  const v = str.trim().split(':').reduce((acc, part) => acc * 60 + parseFloat(part), 0);
  return Number.isFinite(v) ? v : null;
}

function showFramePicker(f, src) {
  const signal = viewerAbort.signal;
  const prev = gallery.videos[f.id];
  let cur = Math.min(prev && typeof prev.t === 'number' ? prev.t : 0, src.duration), shownT = null, busy = false, pending = false, timer = null;
  const canvas = el('canvas', { className: 'frame' });
  const slider = el('input', { type: 'range', min: 0, max: src.duration, step: 0.1, value: cur });
  const timeInput = el('input', { className: 'time-input', value: fmtTenth(cur), inputMode: 'decimal' });
  const msg = el('div', { className: 'hint' });
  const saveBtn = el('button', { className: 'primary', textContent: '📌 이 장면으로 지정', disabled: true });

  async function render() {
    if (busy) { pending = true; return; }
    busy = true;
    saveBtn.disabled = true;
    msg.textContent = '장면 가져오는 중…';
    try {
      do {
        pending = false;
        const r = await extractFrame(src, cur, signal);
        drawFrame(canvas, r.frame, src.rotation);
        r.frame.close();
        shownT = r.t;
      } while (pending);
      msg.textContent = `${fmtTenth(shownT)} 장면이에요. 마음에 들면 지정하세요.`;
      saveBtn.disabled = false;
    } catch (e) {
      if (signal.aborted) return;
      if (e instanceof AuthError) { viewer.close(); return handleError(e); }
      msg.textContent = '장면을 가져오지 못했어요: ' + e.message;
    } finally { busy = false; }
  }
  function setTime(t, immediate) {
    cur = Math.min(Math.max(0, t), src.duration);
    slider.value = cur;
    timeInput.value = fmtTenth(cur);
    clearTimeout(timer);
    timer = setTimeout(render, immediate ? 0 : 250);
  }
  slider.oninput = () => setTime(+slider.value);
  timeInput.onchange = () => { const t = parseTime(timeInput.value); if (t !== null) setTime(t, true); };
  const step = d => () => setTime(cur + d, true);
  saveBtn.onclick = () => {
    saveEntry(f.id, { t: Math.round(shownT * 10) / 10, thumb: capture(canvas, canvas.width, canvas.height), at: new Date().toISOString() });
    viewer.close();
  };
  $('#vBody').replaceChildren(canvas, slider,
    el('div', { className: 'row' },
      el('button', { textContent: '-1초', onclick: step(-1) }),
      el('button', { textContent: '-0.1', onclick: step(-0.1) }),
      timeInput,
      el('button', { textContent: '+0.1', onclick: step(0.1) }),
      el('button', { textContent: '+1초', onclick: step(1) })),
    el('div', { className: 'row' },
      el('button', { textContent: '← 재생 화면', onclick: () => openViewer(f) }),
      saveBtn),
    msg,
    el('p', { className: 'hint', textContent: '재생 화면(드라이브 플레이어)에서 원하는 장면의 시간을 확인해 입력하면 빨라요. 영상 전체가 아니라 그 장면 근처만 받아와요.' }));
  setTime(cur, true);
}

function showPicker(f, url) {
  const video = el('video', { className: 'frame', src: url, controls: true, playsInline: true, preload: 'metadata' });
  const time = el('span', { className: 'time', textContent: '0:00' });
  const msg = el('div', { className: 'hint', textContent: '원하는 장면에서 멈춘 뒤 "이 장면으로 지정"을 누르세요.' });
  const saveBtn = el('button', { className: 'primary', textContent: '📌 이 장면으로 지정', disabled: true });
  const step = d => () => { video.pause(); video.currentTime = Math.min(Math.max(0, video.currentTime + d), video.duration || 0); };
  video.addEventListener('timeupdate', () => { time.textContent = fmtTenth(video.currentTime); });
  video.addEventListener('seeked', () => video.dispatchEvent(new Event('timeupdate')));
  video.addEventListener('loadeddata', () => {
    saveBtn.disabled = false;
    const prev = gallery.videos[f.id];
    if (prev && typeof prev.t === 'number') video.currentTime = prev.t;
  });
  video.addEventListener('error', () => { closeViewerResources(); showUnsupported(f); });
  saveBtn.onclick = () => {
    saveEntry(f.id, { t: Math.round(video.currentTime * 10) / 10, thumb: capture(video, video.videoWidth, video.videoHeight), at: new Date().toISOString() });
    viewer.close();
  };
  $('#vBody').replaceChildren(video,
    el('div', { className: 'row' },
      el('button', { textContent: '-1초', onclick: step(-1) }),
      el('button', { textContent: '-0.1', onclick: step(-0.1) }),
      time,
      el('button', { textContent: '+0.1', onclick: step(0.1) }),
      el('button', { textContent: '+1초', onclick: step(1) }),
      saveBtn),
    msg);
}

// 영상/캔버스의 현재 화면을 긴 변 최대 640px JPEG(data URL)로 (비율 유지)
function capture(source, sw, sh) {
  const k = Math.min(1, 640 / Math.max(sw, sh));
  const w = Math.round(sw * k), h = Math.round(sh * k);
  const c = el('canvas', { width: w, height: h });
  c.getContext('2d').drawImage(source, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.8);
}

// ---------- 확장 프로그램 (있으면 공유 허용 없이 캡처 + 플레이어 조작) ----------
let extReady = false;
const extWaiters = new Map();
window.addEventListener('message', e => {
  if (e.source !== window || !e.data || e.data.source !== 'dgallery-ext') return;
  if (e.data.type === 'ready') {
    if (!extReady) { extReady = true; document.body.classList.add('has-ext'); renderEditBtn(); syncAutoPause(); }
  } else if (e.data.type === 'result') {
    const done = extWaiters.get(e.data.id);
    if (done) { extWaiters.delete(e.data.id); done(e.data); }
  }
});
window.postMessage({ source: 'dgallery-page', type: 'ping' }, location.origin);

function extCall(type, extra = {}) {
  return new Promise((resolve, reject) => {
    const id = crypto.randomUUID();
    const timer = setTimeout(() => { extWaiters.delete(id); reject(new Error('확장 프로그램이 응답하지 않아요.')); }, 5000);
    extWaiters.set(id, res => { clearTimeout(timer); if (res.ok) resolve(res); else reject(new Error(res.error || '확장 프로그램 오류')); });
    window.postMessage({ source: 'dgallery-page', type, id, ...extra }, location.origin);
  });
}

// ---------- 시작 ----------
async function start() {
  $('#login').hidden = true;
  $('#authBtn').hidden = false;
  $('#editBtn').hidden = false;
  renderEditBtn();
  setStatus('불러오는 중…');
  try {
    await loadGallery();
    flushSaves(); // 로그인이 만료돼 멈췄던 저장이 있으면 이어서
    await openFolder();
  } catch (e) { handleError(e); }
}

setEditMode(sessionStorage.getItem('editMode') === '1');
$('#editBtn').onclick = async () => {
  if (needsShare()) {
    const why = await startShare();
    return renderEditBtn(why ? why + ' 버튼을 다시 누르면 다시 물어요.' : undefined);
  }
  setEditMode(!document.body.classList.contains('editing'));
};
$('#authBtn').textContent = '로그아웃';
$('#authBtn').onclick = () => showLoggedOut('로그아웃했어요.');
$('#loginBtn').onclick = async () => {
  try { await requestToken(); start(); } catch (e) { setStatus('로그인 실패: ' + e.message, true); }
};
$('#clientIdSave').onclick = () => {
  const v = $('#clientIdInput').value.trim();
  if (!v.endsWith('.apps.googleusercontent.com')) return setStatus('클라이언트 ID 형식이 아니에요.', true);
  localStorage.setItem('clientId', v);
  location.reload();
};

(async () => {
  renderCrumbs();
  if (!clientId()) { $('#setup').hidden = false; return; }
  try { await loadGis(); } catch { return setStatus('구글 로그인 스크립트를 불러오지 못했어요.', true); }
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: clientId(), scope: SCOPES, callback: () => {} });
  restoreToken();
  if (token) start(); else $('#login').hidden = false;
})();
